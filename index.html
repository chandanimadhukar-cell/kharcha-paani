<style>
  :root{
    --paper:#FBF9F4;
    --card:#FFFFFF;
    --ink:#1B1E2B;
    --ink-soft:#6B7183;
    --rule:#E6E1D6;
    --rule-soft:#F0ECE3;
    --red:#D42D20;
    --amber:#B87400;
    --green:#0F8A4D;
    --focus:#3B82F6;
    --radius:14px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    font-size:15px;line-height:1.45;
    -webkit-font-smoothing:antialiased;
    padding-bottom:calc(96px + env(safe-area-inset-bottom));
  }
  button,input,select{font:inherit;color:inherit}
  button{cursor:pointer;border:none;background:none}
  :focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:6px}
  .num{font-variant-numeric:tabular-nums}

  header{
    position:sticky;top:0;z-index:20;background:var(--paper);
    padding:calc(14px + env(safe-area-inset-top)) 18px 12px;
    border-bottom:1px solid var(--rule-soft);
  }
  .bar{display:flex;align-items:center;justify-content:space-between;gap:8px}
  .wordmark{font-family:'Fraunces',Georgia,serif;font-size:17px;letter-spacing:-.01em;white-space:nowrap}
  .controls{display:flex;align-items:center;gap:8px}
  /* ---- the Month / Year switch ---- */
  .tabs{position:relative;display:grid;grid-template-columns:1fr 1fr;background:var(--rule-soft);border-radius:15px;padding:4px;margin-top:13px}
  .tab-thumb{position:absolute;top:4px;bottom:4px;left:4px;width:calc(50% - 4px);background:var(--card);border-radius:12px;
    box-shadow:0 1px 4px rgba(27,30,43,.14);transition:transform .32s cubic-bezier(.2,.8,.25,1),background .3s}
  .tabs[data-active="year"] .tab-thumb{transform:translateX(100%)}
  .tabs button{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:1px;padding:8px 6px;border-radius:12px;color:var(--ink-soft);transition:color .25s}
  .tabs button b{font-size:14.5px;font-weight:600}
  .tabs button span{font-size:11px}
  .tabs button[aria-pressed="true"]{color:var(--ink)}

<script>
/* ============ storage: localStorage + IndexedDB mirror ============ */
const KEY = 'kharcha.v1';

const ls = (() => {
  let mem = {}, ok = true;
  try { localStorage.setItem('__k','1'); localStorage.removeItem('__k'); } catch(e){ ok = false; }
  return {
    ok,
    get(k){ try { return ok ? localStorage.getItem(k) : (mem[k] ?? null); } catch(e){ return mem[k] ?? null; } },
    set(k,v){ try { ok ? localStorage.setItem(k,v) : (mem[k]=v); } catch(e){ mem[k]=v; } }
  };
})();

const idb = {
  open(){
    return new Promise(res => {
      try {
        const r = indexedDB.open('kharchaPaani', 1);
        r.onupgradeneeded = () => { if (!r.result.objectStoreNames.contains('kv')) r.result.createObjectStore('kv'); };
        r.onsuccess = () => res(r.result);
        r.onerror = () => res(null);
      } catch(e){ res(null); }
    });
  },
  async get(k){
    const d = await this.open(); if (!d) return null;
    return new Promise(res => {
      try { const q = d.transaction('kv','readonly').objectStore('kv').get(k);
        q.onsuccess = () => res(q.result ?? null); q.onerror = () => res(null);
      } catch(e){ res(null); }
    });
  },
  async set(k,v){
    const d = await this.open(); if (!d) return;
    try { d.transaction('kv','readwrite').objectStore('kv').put(v,k); } catch(e){}
  }
};

const BASE_CATS = ['Rent','Rental','Groceries','Home Essentials','Personal Essentials','Shopping','Commute','Travel','Eating Out','Food Apps'];
const PALETTE = ['#FF5A5F','#BF8C00','#57C84D','#22B8CF','#7C5CFF','#F0508C','#3B82F6','#12B886','#FF7847','#9B4DE0','#8FBF3F','#00A6A6','#E8590C','#4DABF7','#B5179E','#7A6A4F'];
const REST_COLOR = '#9AA0AE';

const SAFE_PCT = 0.33;   // at or under a third of income: safe
const CAP_PCT  = 0.40;   // above 40% of income: over limit

let db = { expenses: [], customCats: [], excluded: [], income: 300000, incomes: {}, lastBackup: 0 };

function loadFrom(raw){
  try {
    const p = typeof raw === 'string' ? JSON.parse(raw) : raw;
    if (!p) return null;
    return {
      expenses: Array.isArray(p.expenses) ? p.expenses : [],
      customCats: Array.isArray(p.customCats) ? p.customCats : [],
      excluded: Array.isArray(p.excluded) ? p.excluded : [],
      income: Number(p.income) > 0 ? Number(p.income) : 300000,
      incomes: (p.incomes && typeof p.incomes === 'object') ? p.incomes : {},
      lastBackup: p.lastBackup || 0
    };
  } catch(e){ return null; }
}
const loaded = loadFrom(ls.get(KEY));
if (loaded) db = loaded;
if (migrate()) save();

function mergeInto(target, incoming){
  if (!incoming) return false;
  let changed = false;
  const seen = new Set(target.expenses.map(x => x.id));
  incoming.expenses.forEach(x => { if (x && x.id && !seen.has(x.id)){ target.expenses.push(x); seen.add(x.id); changed = true; } });
  incoming.customCats.forEach(c => { if (!target.customCats.includes(c) && !BASE_CATS.includes(c)){ target.customCats.push(c); changed = true; } });
  incoming.excluded.forEach(c => { if (!target.excluded.includes(c)){ target.excluded.push(c); changed = true; } });
  if (incoming.income && incoming.income !== target.income){ target.income = incoming.income; changed = true; }
  Object.entries(incoming.incomes || {}).forEach(([k,v]) => {
    if (v > 0 && target.incomes[k] !== v){ target.incomes[k] = v; changed = true; }
  });
  if (incoming.lastBackup > target.lastBackup) target.lastBackup = incoming.lastBackup;
  return changed;
}

function save(){
  db.customCats = db.customCats.filter((c,i) => !BASE_CATS.includes(c) && db.customCats.indexOf(c) === i);
  const json = JSON.stringify(db);
  ls.set(KEY, json);
  idb.set(KEY, json);
}

const allCats = () => BASE_CATS.concat(db.customCats);
// every transaction counts one of three ways: this month (default), one-time, or split over N months
// two independent facts about every entry: how it's paid (this month, or split across N months)
// and whether it's a one-time cost kept out of the monthly budget. Either timing can be one-time.
const kindOf = (e) => (e.kind === 'split' && e.months > 1) ? 'split' : 'month';
const isOneTimeEntry = (e) => e.oneTime === true || e.kind === 'onetime';
// Fixed = spend that doesn't move month to month. Worked out by one rule for everyone, never set by hand:
//   · rent and rental categories
//   · split instalments (committed in advance)
//   · anything ≥ ₹1,000 that recurs in the same category in an adjacent month at the same amount (±2%)
// Analysis and tips look only at what's left: the fluctuating spend.
const FIXED_CATS = ['Rent', 'Rental'];
const RECUR_MIN = 1000, RECUR_TOL = 0.02;
let recurringIds = new Set();
const monthNo = (ts) => { const d = new Date(ts); return d.getFullYear() * 12 + d.getMonth(); };
function detectRecurring(){
  recurringIds = new Set();
  const byCat = {};
  db.expenses.forEach(e => { if (!isOneTimeEntry(e) && e.amount >= RECUR_MIN) (byCat[e.category] = byCat[e.category] || []).push(e); });
  Object.values(byCat).forEach(list => list.forEach(e => {
    const m = monthNo(e.ts);
    if (list.some(f => f !== e && Math.abs(monthNo(f.ts) - m) === 1 && Math.abs(f.amount - e.amount) <= e.amount * RECUR_TOL))
      recurringIds.add(e.id);
  }));
}
const isFixed = (e) => FIXED_CATS.includes(e.category) || kindOf(e) === 'split' || recurringIds.has(e.id);

// one-time used to be a per-category switch; carry those entries across once, then retire the switch
function migrate(){
  let changed = false;
  if (db.excluded && db.excluded.length){
    db.expenses.forEach(e => { if (!e.kind && e.oneTime === undefined && db.excluded.includes(e.category)) e.oneTime = true; });
    db.excluded = [];
    changed = true;
  }
  // the earlier single-choice "one-time" becomes the flag, paid this month
  db.expenses.forEach(e => { if (e.kind === 'onetime'){ e.kind = 'month'; e.oneTime = true; changed = true; } });
  return changed;
}

// the single source every total reads from: split entries become one instalment per month
function ledger(){
  const out = [];
  db.expenses.forEach(e => {
    if (kindOf(e) === 'split' && e.months > 1){
      const n = e.months, d0 = new Date(e.ts);
      const each = Math.floor(e.amount / n * 100) / 100;
      for (let k = 0; k < n; k++){
        const lastDay = new Date(d0.getFullYear(), d0.getMonth() + k + 1, 0).getDate();
        const ts = new Date(d0.getFullYear(), d0.getMonth() + k, Math.min(d0.getDate(), lastDay),
                            d0.getHours(), d0.getMinutes()).getTime();
        const amount = k === n - 1 ? Math.round((e.amount - each * (n - 1)) * 100) / 100 : each;
        out.push({ ...e, ts, amount, part: k + 1, of: n, full: e.amount });
      }
    } else out.push(e);
  });
  return out;
}

// the small grey note that says how a row is counted
const kindTag = (e) => {
  const bits = [];
  if (e.part) bits.push(`${e.part} of ${e.of} · ₹${money(e.full)} split`);
  if (isOneTimeEntry(e)) bits.push('one-time');
  if (isFixed(e) && !isOneTimeEntry(e) && !e.part) bits.push('recurring');
  return bits.length ? ` · <span class="ktag">${bits.join(' · ')}</span>` : '';
};
const colorFor = (cat) => {
  const list = allCats();
  const i = list.indexOf(cat);
  return PALETTE[(i < 0 ? list.length : i) % PALETTE.length];
};

/* ============ helpers ============ */
const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const monthKey = (d) => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
const labelFor = (k) => { const [y,m] = k.split('-'); return `${MONTHS[+m-1]} ${y}`; };
const shortLabel = (k) => { const [y,m] = k.split('-'); return `${MONTHS[+m-1].slice(0,3)} ${y.slice(2)}`; };
const money = (n) => n.toLocaleString('en-IN', { maximumFractionDigits: n % 1 ? 2 : 0, minimumFractionDigits: n % 1 ? 2 : 0 });
const fmtDate = (ts) => new Date(ts).toLocaleDateString('en-IN',{ day:'numeric', month:'short' });
const fmtTime = (ts) => new Date(ts).toLocaleTimeString('en-IN',{ hour:'numeric', minute:'2-digit', hour12:true });
const localInput = (d) => { const p = n => String(n).padStart(2,'0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`; };
const dayKey = (ts) => { const d = new Date(ts); const p = n => String(n).padStart(2,'0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`; };
const touched = (e) => e.updatedAt || e.ts;
const byDateDesc = (a, b) => (b.ts - a.ts) || (touched(b) - touched(a));
const esc = (s) => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

let viewMode = 'month';
let openCat = null;        // the one expanded category, or null
let filterCat = null;      // category filter — the picker and the donut share it
let activeDate = null;
let currentMonth = monthKey(new Date());
let currentYear = String(new Date().getFullYear());

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 2400);
}

/* ============ period ============ */
function inPeriod(){
  return ledger().filter(e => {
    const d = new Date(e.ts);
    return viewMode === 'month'
      ? monthKey(d) === currentMonth
      : String(d.getFullYear()) === currentYear;
  }).sort((a,b) => b.ts - a.ts);
}
const periodName = () => viewMode === 'month' ? labelFor(currentMonth) : currentYear;

// income applies from the month it was set onwards, the way a salary actually works
function incomeFor(mk){
  const keys = Object.keys(db.incomes || {}).filter(k => k <= mk).sort();
  if (keys.length) return db.incomes[keys[keys.length - 1]];
  return db.income > 0 ? db.income : 300000;
}
function trackedMonths(){
  const seen = new Set(), nowKey = monthKey(new Date());
  ledger().forEach(e => {
    const d = new Date(e.ts);
    // future instalments of a split don't count as months you've tracked yet
    if (String(d.getFullYear()) === currentYear && monthKey(d) <= nowKey) seen.add(monthKey(d));
  });
  return [...seen].sort();
}
// the two lines that define the zones, for whatever period is on screen
function budgetLines(){
  if (viewMode === 'month'){
    const inc = incomeFor(currentMonth);
    return { income: inc, safe: inc * SAFE_PCT, cap: inc * CAP_PCT, months: 1 };
  }
  const ms = trackedMonths();
  const sum = ms.length ? ms.reduce((s,m) => s + incomeFor(m), 0) : incomeFor(`${currentYear}-01`);
  return { income: sum, safe: sum * SAFE_PCT, cap: sum * CAP_PCT, months: Math.max(ms.length, 1) };
}

function band(total){
  const { safe, cap } = budgetLines();
  if (total > cap) return 'high';
  if (total > safe) return 'mid';
  return 'low';
}
const ZONE = { high:'Over limit', mid:'⚠ Watch it', low:'Safe zone' };

// says where you stand against the budget — never a share of income
function zoneSentence(total){
  const { safe, cap } = budgetLines();
  const z = band(total);
  if (z === 'high') return `${ZONE.high} · ₹${money(Math.round(total - cap))} over your ₹${money(Math.round(cap))} budget`;
  if (z === 'mid')  return `${ZONE.mid} · ₹${money(Math.round(total - safe))} past the safe line · ₹${money(Math.round(cap - total))} left before the cap`;
  return `${ZONE.low} · ₹${money(Math.round(safe - total))} before the warning zone`;
}

function daysToReset(){
  const now = new Date();
  if (viewMode === 'month'){
    if (currentMonth !== monthKey(now)) return null;          // only for the running month
    const lastDay = new Date(now.getFullYear(), now.getMonth() + 1, 0).getDate();
    return lastDay - now.getDate();
  }
  if (currentYear !== String(now.getFullYear())) return null;
  const endOfYear = new Date(now.getFullYear(), 11, 31);
  const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  return Math.round((endOfYear - today) / 86400000);
}
const resetText = (n) => n === 0 ? 'last day' : `${n} day${n === 1 ? '' : 's'} to reset`;


/* =====================================================================
   YEAR — the analysis screen
   ===================================================================== */
let ySelMonth = null;   // a tapped bar: everything below narrows to that month
let ySelCat = null;     // a tapped category: its slice lights up in every bar
const shortINR = v => v >= 100000 ? '₹' + (v/100000).toFixed(v >= 1000000 ? 0 : 1).replace(/\.0$/,'') + 'L'
                   : v >= 10000  ? '₹' + Math.round(v/1000) + 'k'
                   : v >= 1000   ? '₹' + (v/1000).toFixed(1).replace(/\.0$/,'') + 'k'
                   : '₹' + Math.round(v);
const pctStr = v => (Math.abs(v) < 10 ? Math.abs(v).toFixed(1) : Math.round(Math.abs(v))) + '%';
const mShort = i => MONTHS[i].slice(0,3);
const sumBy = (rows, f) => rows.reduce((acc, e) => { if (f(e)) acc[e.category] = (acc[e.category]||0) + e.amount; return acc; }, {});
const total = o => Object.values(o).reduce((s,v) => s + v, 0);
const isFlex = e => !isOneTimeEntry(e) && !isFixed(e);   // the spend that actually moves

function yearModel(){
  const Y = +currentYear, now = new Date();
  const isNowYear = now.getFullYear() === Y;
  const nowIdx = isNowYear ? now.getMonth() : (Y < now.getFullYear() ? 11 : -1);
  const months = Array.from({length:12}, (_,i) => {
    const inc = incomeFor(`${Y}-${String(i+1).padStart(2,'0')}`);
    return { i, rows: [], n: 0, reg: 0, ot: 0, cap: inc * CAP_PCT, safe: inc * SAFE_PCT, future: i > nowIdx };
  });
  ledger().forEach(e => {
    const d = new Date(e.ts);
    if (d.getFullYear() !== Y) return;
    const m = months[d.getMonth()];
    m.rows.push(e); m.n++;
    if (isOneTimeEntry(e)) m.ot += e.amount; else m.reg += e.amount;
  });
  const past = months.filter(m => !m.future && m.n);
  const complete = past.filter(m => !(isNowYear && m.i === nowIdx));
  return { Y, now, isNowYear, nowIdx, months, past, complete };
}

function heroHTML(M){
  const reg = M.past.reduce((s,m) => s + m.reg, 0), ot = M.past.reduce((s,m) => s + m.ot, 0);
  const committed = M.months.filter(m => m.future).reduce((s,m) => s + m.reg + m.ot, 0);
  const basis = M.complete.length ? M.complete : M.past;
  const avg = basis.length ? basis.reduce((s,m) => s + m.reg, 0) / basis.length : 0;
  const judged = M.complete.length ? M.complete : M.past;
  const jReg = judged.reduce((s,m) => s + m.reg, 0);
  const cap = judged.reduce((s,m) => s + m.cap, 0), safe = judged.reduce((s,m) => s + m.safe, 0);
  const used = cap ? jReg / cap : 0;
  const jName = !judged.length ? '' : judged.length === 1 ? MONTHS[judged[0].i] : `${mShort(judged[0].i)}–${mShort(judged[judged.length-1].i)}`;
  const inProgress = M.isNowYear && M.past.some(m => m.i === M.nowIdx) && M.complete.length;
  const fillCol = jReg > cap ? '#FF6B5E' : jReg > safe ? '#F5B83D' : '#3DD68C';
  const span = !M.past.length ? '' : M.past.length === 1 ? MONTHS[M.past[0].i] : `${mShort(M.past[0].i)}–${mShort(M.past[M.past.length-1].i)}`;
  return `<div class="yhero">
    <div class="yh-lbl">Everything spent in ${M.Y}</div>
    <div class="yh-amt"><span class="sym">₹</span>${money(Math.round(reg + ot))}</div>
    <div class="yh-sub">${span ? `${span} · ${M.past.length} month${M.past.length === 1 ? '' : 's'} tracked` : 'Nothing tracked yet'}${committed ? ` · ₹${money(Math.round(committed))} already committed for later months` : ''}</div>
    <div class="ystats">
      <div class="ystat"><b>${shortINR(reg)}</b><span>Regular</span></div>
      <div class="ystat"><b>${shortINR(ot)}</b><span>One-time</span></div>
      <div class="ystat"><b>${shortINR(avg)}</b><span>Avg month${M.complete.length ? '' : ' so far'}</span></div>
    </div>
    ${cap ? `<div class="meter">
      <div class="meter-top"><span>Budget used · ${jName}${inProgress ? ` <span style="opacity:.6">(${mShort(M.nowIdx)} in progress)</span>` : ''}</span><span><b>${Math.round(used*100)}%</b> of ₹${money(Math.round(cap))}</span></div>
      <div class="meter-track"><div class="meter-fill" style="width:${Math.min(used,1)*100}%;background:${fillCol}"></div>
        <i class="meter-safe" style="left:${(SAFE_PCT/CAP_PCT)*100}%"></i><i class="meter-cap"></i></div>
      <div class="meter-legend"><span>Safe up to ${Math.round(SAFE_PCT*100)}% of income</span><span>Cap at ${Math.round(CAP_PCT*100)}%</span></div>
    </div>` : ''}
  </div>`;
}

function barsHTML(M){
  const W = 358, H = 214, L = 4, R = 4, T = 24, B = 26;
  const slot = (W - L - R) / 12, bw = Math.min(22, slot * 0.6);
  const catCol = ySelCat ? colorFor(ySelCat) : null;
  // a picked category gets its own scale, so a ₹6k line isn't flattened by a ₹2.7L month
  const catVal = m => m.rows.filter(e => e.category === ySelCat).reduce((s,e) => s + e.amount, 0);
  const peak = ySelCat
    ? Math.max(...M.months.map(catVal), 1) * 1.18
    : Math.max(...M.months.map(m => Math.max(m.reg + m.ot, m.n ? m.cap : 0)), 1) * 1.12;
  const y = v => T + (H - T - B) * (1 - v / peak);
  let g = `<line x1="${L}" y1="${H-B}" x2="${W-R}" y2="${H-B}" stroke="#E6E1D6"/>`;
  M.months.forEach(m => {
    const cx = L + slot * m.i + slot / 2, x = cx - bw / 2;
    const tot = m.reg + m.ot;
    const picked = ySelMonth === m.i, dimMonth = ySelMonth !== null && !picked;
    const op = (m.future ? .38 : 1) * (dimMonth ? .28 : 1);
    if (picked) g += `<rect x="${cx - slot/2 + 1}" y="${T - 18}" width="${slot - 2}" height="${H - T + 18 - B + 4}" rx="7" fill="#EEF2FC"/>`;
    if (ySelCat){
      const cv = catVal(m);
      if (cv > 0){
        const yc = y(cv);
        g += `<rect x="${x}" y="${yc}" width="${bw}" height="${H-B-yc}" rx="3" fill="${catCol}" opacity="${op}"/>`;
        g += `<text x="${cx}" y="${yc - 7}" text-anchor="middle" font-size="9" font-weight="${picked ? 700 : 600}" fill="${m.future || dimMonth ? '#A0A5B3' : '#1B1E2B'}">${shortINR(cv)}</text>`;
      } else if (!m.future) g += `<rect x="${x}" y="${H-B-2}" width="${bw}" height="2" rx="1" fill="#E6E1D6"/>`;
    } else if (tot > 0){
      const over = !m.future && m.reg > m.cap;
      const yReg = y(m.reg), yTot = y(tot);
      const fade = 1;
      if (m.reg) g += `<rect x="${x}" y="${yReg}" width="${bw}" height="${H-B-yReg}" rx="3" fill="${over ? '#E8453C' : '#3B6FE0'}" opacity="${op * fade}"/>`;
      if (m.ot)  g += `<rect x="${x}" y="${yTot}" width="${bw}" height="${Math.max(yReg - yTot - (m.reg ? 1.5 : 0), 1)}" rx="3" fill="#A9C1F5" opacity="${op * fade}"/>`;
      const label = shortINR(tot), labelY = yTot;
      if (label) g += `<text x="${cx}" y="${labelY - 7}" text-anchor="middle" font-size="9" font-weight="${picked ? 700 : 600}" fill="${m.future || dimMonth ? '#A0A5B3' : '#1B1E2B'}">${label}</text>`;
    } else if (!m.future){
      g += `<rect x="${x}" y="${H-B-2}" width="${bw}" height="2" rx="1" fill="#E6E1D6"/>`;
    }
    if (!ySelCat && (m.n || !m.future)) g += `<line x1="${cx - bw/2 - 3}" x2="${cx + bw/2 + 3}" y1="${y(m.cap)}" y2="${y(m.cap)}" stroke="#D42D20" stroke-width="1.5" stroke-dasharray="3 2" opacity="${(m.n ? .75 : .25) * (dimMonth ? .5 : 1)}"/>`;
    g += `<text x="${cx}" y="${H-8}" text-anchor="middle" font-size="10" fill="${picked || (ySelMonth === null && M.isNowYear && m.i === M.nowIdx) ? '#1B1E2B' : '#8A90A0'}" font-weight="${picked ? 700 : 400}">${MONTH_LETTER[m.i]}</text>`;
    // one generous tap target per month, the full height of the chart
    if (m.n) g += `<rect class="bar-hit" data-m="${m.i}" x="${cx - slot/2}" y="${T - 18}" width="${slot}" height="${H - T + 18}" fill="transparent"/>`;
  });
  return `<svg class="bars" viewBox="0 0 ${W} ${H}" role="img" aria-label="Spend by month in ${M.Y}">${g}</svg>
    <div class="legend">${ySelCat
      ? `<span><i style="background:${catCol}"></i>${esc(ySelCat)} each month · scaled to this category</span>`
      : `<span><i style="background:#3B6FE0"></i>Regular</span><span><i style="background:#A9C1F5"></i>One-time</span>
         <span><i style="background:#E8453C"></i>Over cap</span><span><i class="tick"></i>40% cap</span>`}</div>`;
}

function selBarHTML(M){
  if (ySelMonth === null && !ySelCat) return '';
  const bits = [];
  if (ySelMonth !== null){ const m = M.months[ySelMonth]; bits.push(`<b>${MONTHS[ySelMonth]}</b> · ₹${money(Math.round(m.reg + m.ot))}`); }
  if (ySelCat) bits.push(`<b>${esc(ySelCat)}</b>`);
  return `<div class="ysel"><span>${bits.join(' &nbsp;·&nbsp; ')}</span><button id="yClear">Show the whole year</button></div>`;
}

function categoriesHTML(M){
  const scope = ySelMonth !== null ? [M.months[ySelMonth]] : M.past;
  const rows = scope.flatMap(m => m.rows);
  const cats = {};
  rows.forEach(e => {
    const c = cats[e.category] || (cats[e.category] = { c: e.category, reg: 0, ot: 0, n: 0, fixed: 0 });
    if (isOneTimeEntry(e)) c.ot += e.amount; else c.reg += e.amount;
    if (isFixed(e) && !isOneTimeEntry(e)) c.fixed += e.amount;
    c.n++;
  });
  const list = Object.values(cats).map(c => ({ ...c, tot: c.reg + c.ot })).sort((a,b) => b.tot - a.tot);
  const all = list.reduce((s,c) => s + c.tot, 0) || 1, max = list.length ? list[0].tot : 1;
  if (!list.length) return `<p class="hint">Nothing recorded${ySelMonth !== null ? ' in ' + MONTHS[ySelMonth] : ''}.</p>`;
  return list.map(c => {
    const col = colorFor(c.c), on = ySelCat === c.c, dim = ySelCat && !on;
    const notes = [];
    if (c.ot) notes.push(`₹${money(Math.round(c.ot))} one-time`);
    if (c.fixed && c.fixed === c.reg && !c.ot) notes.push('fixed');
    else if (c.fixed) notes.push(`₹${money(Math.round(c.fixed))} fixed`);
    notes.push(`${c.n} entr${c.n === 1 ? 'y' : 'ies'}`);
    return `<button class="ycat${on ? ' on' : ''}${dim ? ' dim' : ''}" data-cat="${esc(c.c)}">
      <span class="ycat-name"><i class="dot" style="background:${col}"></i>${esc(c.c)}</span>
      <span class="ycat-val"><b>₹${money(Math.round(c.tot))}</b><span>${pctStr(c.tot / all * 100)}</span></span>
      <span class="ycat-bar"><i style="width:${c.reg / max * 100}%;background:${col}"></i><i style="width:${c.ot / max * 100}%;background:${col};opacity:.35"></i></span>
      <span class="ycat-note">${notes.join(' · ')}</span>
    </button>`;
  }).join('');
}

// movement in fluctuating spend only: fixed costs and one-time purchases are left out on purpose
function changesHTML(M){
  const target = ySelMonth !== null ? M.months[ySelMonth] : M.past[M.past.length - 1];
  const prev = target ? [...M.past].reverse().find(m => m.i < target.i) : null;
  if (!target || !target.n || !prev) return { html: `<p class="hint">${!target || !target.n ? 'No data for this month.' : `Nothing earlier than ${MONTHS[target.i]} to compare with.`}</p>`, lbl: '' };
  const partial = M.isNowYear && target.i === M.nowIdx;
  const cutoff = partial ? M.now.getDate() : 31;
  const a = sumBy(prev.rows, e => isFlex(e) && new Date(e.ts).getDate() <= cutoff);
  const b = sumBy(target.rows, e => isFlex(e) && new Date(e.ts).getDate() <= cutoff);
  const A = total(a), Bt = total(b);
  const lbl = (partial ? `${mShort(target.i)} 1–${cutoff} vs ${mShort(prev.i)} 1–${cutoff}` : `${MONTHS[target.i]} vs ${MONTHS[prev.i]}`)
            + ' · fixed and one-time costs left out';
  const cards = [];
  const card = (dir, title, body) => cards.push(`<div class="card"><div class="ic ${dir}">${dir === 'up' ? '▲' : dir === 'down' ? '▼' : '='}</div><div><b>${title}</b><p>${body}</p></div></div>`);
  const dT = Bt - A;
  card(Math.abs(dT) < 1 ? 'flat' : dT > 0 ? 'up' : 'down',
    A ? `Day-to-day spend ${dT > 0 ? 'up' : 'down'} ${pctStr(dT / A * 100)}` : 'Day-to-day spend',
    `₹${money(Math.round(A))} → ₹${money(Math.round(Bt))}${partial ? ' over the same days' : ''}.`);
  const moves = [...new Set([...Object.keys(a), ...Object.keys(b)])]
    .map(c => ({ c, a: a[c]||0, b: b[c]||0, d: (b[c]||0) - (a[c]||0) }))
    .filter(m => Math.abs(m.d) >= 200)
    .sort((x,y) => Math.abs(y.d) - Math.abs(x.d)).slice(0, 3);
  moves.forEach(m => {
    if (!m.a) card('up', `${esc(m.c)} is new`, `₹${money(Math.round(m.b))} in ${mShort(target.i)}${partial ? ' so far' : ''}, nothing in ${mShort(prev.i)}${partial ? ' by this point' : ''}.`);
    else if (!m.b) card('down', `No ${esc(m.c)} ${partial ? 'yet' : `in ${mShort(target.i)}`}`, `₹${money(Math.round(m.a))} ${partial ? 'by this point in' : 'in'} ${mShort(prev.i)}.`);
    else card(m.d > 0 ? 'up' : 'down', `${esc(m.c)} ${m.d > 0 ? 'up' : 'down'} ${pctStr(m.d / m.a * 100)}`,
      `₹${money(Math.round(m.a))} → ₹${money(Math.round(m.b))} (${m.d > 0 ? '+' : '−'}₹${money(Math.round(Math.abs(m.d)))}).`);
  });
  if (!moves.length) card('flat', 'No big swings', 'No category moved by more than ₹200.');
  return { html: cards.join(''), lbl };
}

// advice about the spend you can actually change
function tipsHTML(M){
  const R = ySelMonth !== null ? M.months[ySelMonth]
          : (M.complete.length ? M.complete[M.complete.length - 1] : M.past[M.past.length - 1]);
  if (!R || !R.n) return `<p class="hint">Tips appear once there's a month of data.</p>`;
  const name = MONTHS[R.i], done = !(M.isNowYear && R.i === M.nowIdx);
  const flexCat = sumBy(R.rows, isFlex), flex = total(flexCat);
  const fixed = R.rows.filter(e => !isOneTimeEntry(e) && isFixed(e)).reduce((s,e) => s + e.amount, 0);
  const counts = {}; R.rows.forEach(e => { if (isFlex(e)) counts[e.category] = (counts[e.category]||0) + 1; });
  const tips = [];
  const tip = (title, body) => tips.push(`<div class="card"><div class="ic tip">✦</div><div><b>${title}</b><p>${body}</p></div></div>`);

  // 1 — where the month landed, and how much of the moving spend that implies
  const room = flex ? ` Fixed costs (₹${money(Math.round(fixed))}) don't move, so it all has to come from your ₹${money(Math.round(flex))} of day-to-day spend` : '';
  if (R.reg > R.cap) tip(`${name} ran ₹${money(Math.round(R.reg - R.cap))} over the cap`,
    `Getting back to safe means ₹${money(Math.round(R.reg - R.safe))} less a month.${room ? room + ` — about ${pctStr((R.reg - R.safe) / flex * 100)} of it.` : ''}`);
  else if (R.reg > R.safe) tip(`${name} ${done ? 'finished' : 'is'} ₹${money(Math.round(R.reg - R.safe))} past the safe line`,
    `Only ₹${money(Math.round(R.cap - R.reg))} under the cap.${room ? room + ` — about ${pctStr((R.reg - R.safe) / flex * 100)} of it.` : ''}`);
  else tip(`${name} ${done ? 'stayed' : 'is'} ₹${money(Math.round(R.safe - R.reg))} inside the safe zone`,
    `₹${money(Math.round(flex))} of it was day-to-day spend; the rest is fixed.`);

  // 2 — the biggest fluctuating category
  const ranked = Object.entries(flexCat).sort((a,b) => b[1] - a[1]);
  if (ranked.length){
    const [c, v] = ranked[0];
    tip(`${esc(c)} is your biggest day-to-day spend`,
      `₹${money(Math.round(v))} in ${name} across ${counts[c]} entr${counts[c] === 1 ? 'y' : 'ies'} — ${pctStr(v / flex * 100)} of what moves. Trimming a fifth saves ₹${money(Math.round(v * .2))} a month, ₹${money(Math.round(v * .2 * 12))} a year.`);
  }
  // 3 — small, frequent spends
  const freq = Object.entries(counts).filter(([c]) => !ranked.length || c !== ranked[0][0]).sort((a,b) => b[1] - a[1])[0];
  if (freq && freq[1] >= 8){
    const [c, n] = freq, v = flexCat[c] || 0;
    tip(`${n} ${esc(c)} payments in ${name}`,
      `Averaging ₹${money(Math.round(v / n))} each, they added up to ₹${money(Math.round(v))}. Small, frequent spends are the easiest to miss.`);
  }
  // 4 — the next two categories together, if they're a meaningful slice
  if (ranked.length >= 3 && tips.length < 4){
    const [[c2, v2], [c3, v3]] = [ranked[1], ranked[2]];
    tip(`${esc(c2)} and ${esc(c3)}: ₹${money(Math.round(v2 + v3))}`,
      `Together ${pctStr((v2 + v3) / flex * 100)} of ${name}'s day-to-day spend — the next places to look after ${esc(ranked[0][0])}.`);
  }
  return tips.slice(0, 4).join('');
}

function renderYear(){

  if (ySelMonth !== null && !M.months[ySelMonth].n) ySelMonth = null;
  const ch = changesHTML(M);
  const scopeName = ySelMonth !== null ? MONTHS[ySelMonth] : M.Y;

    ${heroHTML(M)}
    <section class="ysec">
      <h2>Month by month</h2>
      <p class="lede">Tap a month to focus on it. Tap a category below to see it in every month.</p>
      ${barsHTML(M)}
      ${selBarHTML(M)}
    </section>
    <section class="ysec">
      <h2>Where ${scopeName} went</h2>
      <p class="lede">Share of everything spent${ySelMonth !== null ? '' : ' this year'}, one-time costs included. Tap one to trace it.</p>
      ${categoriesHTML(M)}
    </section>
    <section class="ysec">
      <h2>What changed</h2>
      <p class="lede">Only spend that moves month to month.</p>

    </section>

  const clr = document.getElementById('yClear'); if (clr) clr.onclick = () => { ySelMonth = null; ySelCat = null; keep(); };
  const cap = M.past.reduce((s,m) => s + m.cap, 0);
  document.getElementById('incomeState').textContent = `${M.Y} budget ₹${money(Math.round(cap))} across ${M.past.length} tracked month${M.past.length === 1 ? '' : 's'}.`;
  renderBanners();
}

function switchView(next, monthToOpen){
  if (next === 'year') currentYear = (monthToOpen || currentMonth).split('-')[0];
  else if (monthToOpen) currentMonth = monthToOpen;
  else if (currentMonth.split('-')[0] !== currentYear){
    const now = new Date();
    currentMonth = String(now.getFullYear()) === currentYear ? monthKey(now) : `${currentYear}-01`;
  }
  viewMode = next;
  ySelMonth = null; ySelCat = null;
  activeDate = null; document.getElementById('dateInput').value = ''; openCat = null; filterCat = null;
  render();
  window.scrollTo(0, 0);
}

/* ============ render ============ */
const DONUT_SLICES = 5;        // top N get their own colour; the tail folds into "Rest"
const MONTH_LETTER = ['J','F','M','A','M','J','J','A','S','O','N','D'];

function aggregate(list){
  const by = {};
  list.forEach(e => {
    const a = by[e.category] || (by[e.category] = { cat: e.category, total: 0, items: [], latest: 0 });
    a.total += e.amount;
    a.items.push(e);
    if (e.ts > a.latest) a.latest = e.ts;
  });
  const out = Object.values(by);
  out.forEach(a => a.items.sort(byDateDesc));
  return out;
}

function donutHTML(cats, total){
  if (!total) return '';
  const R = 72, C = 2 * Math.PI * R;
  const big = [...cats].sort((a,b) => b.total - a.total);
  let parts = big.slice(0, DONUT_SLICES).map(c => ({ cat: c.cat, total: c.total, color: colorFor(c.cat) }));
  const tail = big.slice(DONUT_SLICES);
  if (tail.length) parts.push({ cat: null, total: tail.reduce((s,c) => s + c.total, 0), color: REST_COLOR });

  const gap = parts.length > 1 ? 2.5 : 0;
  let off = 0, segs = '', hits = '';
  parts.forEach(p => {
    const full = p.total / total * C;
    const len = Math.max(full - gap, 1.5);
    const key = p.cat === null ? '__rest' : p.cat;
    const cls = filterCat === key ? 'seg on' : (filterCat ? 'seg off' : 'seg');
    segs += `<circle class="${cls}" r="${R}" cx="100" cy="100"
      fill="none" stroke="${p.color}" stroke-width="28"
      stroke-dasharray="${len.toFixed(2)} ${(C - len).toFixed(2)}" stroke-dashoffset="${(-off).toFixed(2)}"></circle>`;
    // an invisible, much wider ring on top of each slice: the thing your finger actually hits
    hits += `<circle class="hit" data-cat="${esc(key)}" r="${R}" cx="100" cy="100"
      fill="none" stroke="#000" stroke-opacity="0" stroke-width="50" pointer-events="stroke"
      stroke-dasharray="${full.toFixed(2)} ${(C - full).toFixed(2)}" stroke-dashoffset="${(-off).toFixed(2)}"></circle>`;
    off += full;
  });
  return `<g transform="rotate(-90 100 100)">${segs}${hits}</g>`;
}

/* ---- year view: one point per month, Jan to Dec ---- */
function trendHTML(){
  const W = 320, H = 178, L = 26, R = 26, T = 26, B = 24;
  const totals = Array(12).fill(0);
  let any = false;
  ledger().forEach(e => {
    const d = new Date(e.ts);
    if (String(d.getFullYear()) !== currentYear) return;
    if (filterCat ? e.category !== filterCat : isOneTimeEntry(e)) return;
    totals[d.getMonth()] += e.amount;
    any = true;
  });
  if (!any) return `<p class="empty">Nothing recorded in ${esc(currentYear)} yet.</p>`;

  const now = new Date();
  const last = String(now.getFullYear()) === currentYear ? now.getMonth() : 11;
  const first = totals.findIndex((v,i) => v > 0 && i <= last);   // start at the first tracked month
  const vals = totals.slice(first, last + 1);
  const bl = budgetLines();
  const limit = filterCat ? null : bl.cap / bl.months;          // the 40% cap, per month
  const peak = Math.max(...vals, limit || 0) * 1.12 || 1;

  const span = vals.length - 1;
  const x = i => L + (W - L - R) * (span === 0 ? 0.5 : i / span);
  const y = v => T + (H - T - B) * (1 - v / peak);
  const line = vals.map((v,i) => `${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
  const stroke = filterCat ? colorFor(filterCat) : '#3B82F6';

  const capCaption = () => {
    const yl = y(limit), first = y(vals[0]), lastY = y(vals[vals.length - 1]);
    const leftGap = Math.abs(first - yl), rightGap = Math.abs(lastY - yl);
    const left = leftGap >= rightGap;
    const pointY = left ? first : lastY;
    // sit on the side of the line away from the nearest point (and its label, which sits above it)
    const cy = pointY < yl ? yl + 11 : yl - 5;
    return `<text x="${left ? L - 18 : W - R + 18}" y="${cy.toFixed(1)}" text-anchor="${left ? 'start' : 'end'}"
      font-size="8.5" fill="#D42D20" opacity=".8">budget cap</text>`;
  };
  const limitLine = limit ? `
    <line x1="${L - 18}" y1="${y(limit).toFixed(1)}" x2="${W-R+18}" y2="${y(limit).toFixed(1)}"
      stroke="${'#D42D20'}" stroke-width="1" stroke-dasharray="4 4" opacity=".55"></line>
    ${capCaption()}` : '';

  const dots = vals.map((v,i) => `
    <circle class="tpt" data-m="${first + i}" cx="${x(i).toFixed(1)}" cy="${y(v).toFixed(1)}" r="4.5"
      fill="${stroke}" stroke="#FBF9F4" stroke-width="2"><title>${MONTHS[first + i]}: ₹${money(v)}</title></circle>`).join('');

  // compact Indian figures so twelve labels fit: ₹8.4k, ₹63k, ₹1.2L
  const short = v => v >= 100000 ? '₹' + (v/100000).toFixed(v >= 1000000 ? 0 : 1).replace(/\.0$/,'') + 'L'
                   : v >= 10000  ? '₹' + Math.round(v/1000) + 'k'
                   : v >= 1000   ? '₹' + (v/1000).toFixed(1).replace(/\.0$/,'') + 'k'
                   : '₹' + Math.round(v);
  const fs = vals.length > 8 ? 8.5 : vals.length > 5 ? 9.5 : 10.5;
  // a dip gets its label underneath, so the line climbing out of it never runs through the text
  const isDip = i => {
    const n = [vals[i-1], vals[i+1]].filter(v => v !== undefined);
    return n.length && n.every(v => v > vals[i]);
  };
  const labels = vals.map((v,i) => v ? `<text x="${x(i).toFixed(1)}"
      y="${(isDip(i) ? Math.min(y(v) + 18, H - B - 2) : Math.max(y(v) - 10, 11)).toFixed(1)}"
      text-anchor="middle" font-size="${fs}" fill="#1B1E2B" font-weight="600">${short(v)}</text>` : '').join('');
  const peakLabel = labels;

  const axis = vals.map((v,i) => `<text x="${x(i).toFixed(1)}" y="${H-7}" text-anchor="middle" font-size="9.5" fill="#6B7183">${MONTH_LETTER[first + i]}</text>`).join('');

  return `<svg class="trend" viewBox="0 0 ${W} ${H}" aria-label="Monthly spend across ${currentYear}">
    ${limitLine}
    <polyline points="${line}" fill="none" stroke="${stroke}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"></polyline>
    ${dots}${peakLabel}${axis}
  </svg>`;
}

/* ---- the category picker ---- */
function fillCatFilter(cats, restCount){
  const sel = document.getElementById('catFilter');
  const opts = ['<option value="">All categories</option>']
    .concat(restCount ? [`<option value="__rest">Everything else (${restCount})</option>`] : [])
    .concat([...new Set([...cats].sort((a,b) => b.total - a.total).map(c => c.cat))]
      .map(c => `<option value="${esc(c)}">${esc(c)}</option>`));
  sel.innerHTML = opts.join('');
  const valid = filterCat === '__rest' ? !!restCount : cats.some(c => c.cat === filterCat);
  sel.value = filterCat && valid ? filterCat : '';
  sel.dataset.on = !!sel.value;
}

function render(){
  detectRecurring();
  const yr = viewMode === 'year';
  document.body.classList.toggle('year', yr);
  document.getElementById('monthView').hidden = yr;
  document.getElementById('yearView').hidden = !yr;
  const tg = document.getElementById('viewToggle');
  tg.dataset.active = viewMode;
  tg.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', x.dataset.view === viewMode));
  document.getElementById('periodLabel').textContent = yr ? currentYear : shortLabel(currentMonth);
  if (yr){ renderYear(); return; }

  const rows = inPeriod();
  const periodCounted = rows.filter(e => !isOneTimeEntry(e));
  const periodTotal = periodCounted.reduce((s,e) => s + e.amount, 0);

  // what the filters leave behind
  const dayRows = activeDate ? rows.filter(e => dayKey(e.ts) === activeDate) : rows;
  const counted = dayRows.filter(e => !isOneTimeEntry(e));
  const oneTime = dayRows.filter(e => isOneTimeEntry(e));
  const total = counted.reduce((s,e) => s + e.amount, 0);
  const oneTimeTotal = oneTime.reduce((s,e) => s + e.amount, 0);

  document.getElementById('periodLabel').textContent =
    viewMode === 'month' ? shortLabel(currentMonth) : currentYear;

  const countedCats = aggregate(counted).sort((a,b) => b.latest - a.latest);
  const oneTimeCats = aggregate(oneTime).sort((a,b) => b.latest - a.latest).map(c => ({ ...c, one: true }));
  const allCatsHere = [...countedCats, ...oneTimeCats];

  const restCats = viewMode === 'month'
    ? [...countedCats].sort((a,b) => b.total - a.total).slice(DONUT_SLICES) : [];
  const restAgg = restCats.length ? {
    cat: 'Everything else', isRest: true,
    total: restCats.reduce((s,c) => s + c.total, 0),
    items: restCats.flatMap(c => c.items).sort(byDateDesc),
    names: restCats.map(c => c.cat)
  } : null;

  if (filterCat === '__rest' ? !restAgg : (filterCat && !allCatsHere.some(c => c.cat === filterCat))) filterCat = null;
  fillCatFilter(allCatsHere, restCats.length);
  document.getElementById('dateInput').dataset.on = !!activeDate;
  document.getElementById('clearFilters').hidden = !filterCat && !activeDate;

  const sel = filterCat === '__rest' ? restAgg : (filterCat ? allCatsHere.find(c => c.cat === filterCat) : null);

  /* ---- chart: donut for a month, trend line for a year ---- */
  const donutWrap = document.getElementById('donutWrap');
  const trendWrap = document.getElementById('trendWrap');
  donutWrap.hidden = viewMode !== 'month';
  trendWrap.hidden = viewMode === 'month';

  if (viewMode === 'month'){
    document.getElementById('donut').innerHTML = donutHTML(countedCats, total);
    const shownAmt = sel ? sel.total : total;
    const amtStr = '₹' + money(shownAmt);
    const size = amtStr.length > 10 ? 20 : amtStr.length > 8 ? 23 : 27;
    const amtEl = document.getElementById('centerAmt');
    amtEl.textContent = amtStr;
    amtEl.style.fontSize = size + 'px';

    // the centre's caption: category gets its share, a date gets the date
    const dateLbl = activeDate ? fmtDate(new Date(activeDate + 'T00:00').getTime()) : '';
    let caption;
    if (sel){
      const denom = total || 1;
      const share = sel.one ? null : (sel.total / denom * 100);
      caption = sel.cat + (share === null ? ' · one-time' : ` · ${share.toFixed(share < 10 ? 1 : 0)}%`) + (dateLbl ? ' · ' + dateLbl : '');
    } else {
      caption = dateLbl || (viewMode === 'month' ? labelFor(currentMonth).split(' ')[0] : currentYear);
    }
    document.getElementById('centerLbl').textContent = caption;
  } else {
    trendWrap.innerHTML = trendHTML();
    trendWrap.querySelectorAll('.tpt').forEach(dot => dot.onclick = () => {
      currentMonth = `${currentYear}-${String(+dot.dataset.m + 1).padStart(2,'0')}`;
      viewMode = 'month';
      document.querySelectorAll('#viewToggle button').forEach(x => x.setAttribute('aria-pressed', x.dataset.view === 'month'));
      render();
    });
  }

  /* ---- meta, zone sentence, one-time note ---- */
  const dl = daysToReset();
  const ticker = dl === null ? '' : ` · <span class="ticker">${resetText(dl)}</span>`;
  const where = activeDate ? ' on ' + fmtDate(new Date(activeDate + 'T00:00').getTime()) : ' in ' + periodName();
  document.getElementById('totalMeta').innerHTML = dayRows.length
    ? `${counted.length} ${counted.length === 1 ? 'entry' : 'entries'}${where}${ticker}`
    : `Nothing recorded${where}${ticker}`;

  // the zone always judges the whole period, never one day or one category
  const z = band(periodTotal);
  document.getElementById('totalBox').className = 'viz total ' + (periodCounted.length ? z : '');
  document.getElementById('zoneLine').textContent = periodCounted.length ? zoneSentence(periodTotal) : '';
  document.getElementById('subtotal').innerHTML = oneTimeTotal
    ? `One-time costs: <b>₹${money(oneTimeTotal)}</b> — not counted above`
    : '';

  /* ---- the list: your last 5 entries until a filter is chosen ---- */
  const wrap = document.getElementById('listWrap');
  if (!filterCat && !activeDate){
    // the five you entered most recently in this month (or year), then laid out newest date first
    const recent = [...rows].sort((a,b) => touched(b) - touched(a)).slice(0, 5).sort(byDateDesc);
    wrap.innerHTML = !recent.length
      ? `<p class="hint">Nothing recorded in ${esc(periodName())} yet.</p>`
      : `<div class="list-label">Last ${recent.length} added</div>
         <table class="tbl recent"><tbody>${recent.map(e => `
           <tr data-id="${e.id}">
             <td class="num">${fmtDate(e.ts)}<span class="sub">${fmtTime(e.ts)}</span></td>
             <td><div class="cat-cell"><i class="dot" style="background:${colorFor(e.category)}"></i>${esc(e.category)}</div>
                 <span class="sub">${esc(e.mode)}${e.note ? ' · ' + esc(e.note) : ''}${kindTag(e)}</span></td>
             <td class="amt num">₹${money(e.amount)}</td>
           </tr>`).join('')}</tbody></table>`;
    wrap.querySelectorAll('tbody tr').forEach(tr => tr.onclick = () => openDetail(tr.dataset.id));
  } else if (filterCat === '__rest' && restAgg){
    const pct = total ? restAgg.total / total * 100 : 0;
    wrap.innerHTML = `<div class="rest-head">
        <span class="r-left"><i class="dot" style="background:${REST_COLOR}"></i><span class="r-name">Everything else</span>
          <span class="g-count">${restAgg.items.length}</span></span>
        <span class="r-right"><span class="r-pct num">${pct.toFixed(pct < 10 ? 1 : 0)}%</span><b class="num">₹${money(restAgg.total)}</b></span>
      </div>
      <div class="rest-names">${restAgg.names.map(esc).join(' · ')}</div>
      <table class="tbl grp"><tbody>${restAgg.items.map(e => `
        <tr data-id="${e.id}">
          <td class="num">${fmtDate(e.ts)}<span class="sub">${fmtTime(e.ts)}</span></td>
          <td>${esc(e.mode)}${e.note ? ' · ' + esc(e.note) : ''}${kindTag(e)}<span class="sub cat-tag">${esc(e.category)}</span></td>
          <td class="amt num">₹${money(e.amount)}</td>
        </tr>`).join('')}</tbody></table>`;
    wrap.querySelectorAll('tbody tr').forEach(tr => tr.onclick = () => openDetail(tr.dataset.id));
  } else {
    let listCats = filterCat ? allCatsHere.filter(c => c.cat === filterCat) : allCatsHere;
    if (!listCats.length){
      wrap.innerHTML = `<p class="hint">Nothing matches those filters.</p>`;
    } else {
      const rowHTML = (c) => {
        const one = !!c.one;
        const key = (one ? 'ot:' : '') + c.cat;
        const open = openCat === key || (!!filterCat && listCats.length > 1);
        const pct = total ? c.total / total * 100 : 0;
        return `<div class="row">
          <button class="row-head" data-cat="${esc(key)}" aria-expanded="${open}">
            <span class="r-left">
              <i class="dot" style="background:${colorFor(c.cat)}"></i>
              <span class="r-name">${esc(c.cat)}${one ? '<span class="tag">one-time</span>' : ''}</span>
              <span class="g-count">${c.items.length}</span>
            </span>
            <span class="r-right">
              <span class="r-pct num">${one ? '' : pct.toFixed(pct < 10 ? 1 : 0) + '%'}</span>
              <b class="num">₹${money(c.total)}</b>
              <span class="chev${open ? ' open' : ''}">›</span>
            </span>
          </button>
          ${open ? `<div class="panel">
            <table class="tbl grp"><tbody>${c.items.map(e => `
              <tr data-id="${e.id}">
                <td class="num">${fmtDate(e.ts)}<span class="sub">${fmtTime(e.ts)}</span></td>
                <td>${esc(e.mode)}${kindTag(e)}${e.note ? `<span class="sub">${esc(e.note)}</span>` : ''}</td>
                <td class="amt num">₹${money(e.amount)}</td>
              </tr>`).join('')}</tbody></table>
          </div>` : ''}
        </div>`;
      };

      // one category in view opens itself; several stay collapsed
      if (listCats.length === 1) openCat = (listCats[0].one ? 'ot:' : '') + listCats[0].cat;
      wrap.innerHTML = listCats.map(rowHTML).join('');

      wrap.querySelectorAll('.row-head').forEach(h => h.onclick = () => {
        openCat = openCat === h.dataset.cat ? null : h.dataset.cat;
        render();
      });
      wrap.querySelectorAll('tbody tr').forEach(tr => tr.onclick = () => openDetail(tr.dataset.id));
    }
  }

  /* ---- tapping a slice is the same as picking that category ---- */
  document.querySelectorAll('#donut .hit[data-cat]').forEach(seg => seg.onclick = () => {
    const c = seg.dataset.cat;
    filterCat = filterCat === c ? null : c;
    openCat = filterCat;
    render();
  });

  const bl = budgetLines();
  document.getElementById('incomeState').textContent = viewMode === 'month'
    ? `${labelFor(currentMonth).split(' ')[0]} budget ₹${money(Math.round(bl.cap))} — 40% of ₹${money(bl.income)} income.`
    : `${currentYear} budget ₹${money(Math.round(bl.cap))} across ${bl.months} tracked month${bl.months === 1 ? '' : 's'}.`;
  renderBanners();
}

const DAY = 86400000;
function renderBanners(){
  const box = document.getElementById('banners');
  let html = '';
  if (!ls.ok) html += `<div class="banner info">Preview mode — entries clear when you close this. Open the installed app to keep them.</div>`;

  const since = db.lastBackup ? Date.now() - db.lastBackup : null;
  const state = document.getElementById('backupState');
  if (!db.expenses.length) state.textContent = 'Data lives on this phone.';
  else if (!db.lastBackup) state.textContent = 'Never backed up.';
  else {
    const d = Math.floor(since / DAY);
    state.textContent = d < 1 ? 'Backed up today.' : `Last backup ${d} day${d === 1 ? '' : 's'} ago.`;
  }

  if (db.expenses.length && (!db.lastBackup || since > 7 * DAY)){
    html += `<div class="banner warn">
      <span>${db.lastBackup ? 'It has been over a week since your last backup.' : 'No backup yet. One tap saves a copy to iCloud Drive.'}</span>
      <button id="bannerBackup">Back up</button></div>`;
  }
  box.innerHTML = html;
  const b = document.getElementById('bannerBackup');
  if (b) b.onclick = doBackup;
}

const menu = document.getElementById('periodMenu');
const periodBtn = document.getElementById('periodBtn');

periodBtn.onclick = (ev) => {
  ev.stopPropagation();
  const open = menu.classList.toggle('open');
  menu.style.top = (periodBtn.offsetTop + periodBtn.offsetHeight + 6) + 'px';
  periodBtn.setAttribute('aria-expanded', open);
  if (!open) return;

  const totals = {};
  ledger().filter(e => !isOneTimeEntry(e)).forEach(e => {
    const d = new Date(e.ts);
    const k = viewMode === 'month' ? monthKey(d) : String(d.getFullYear());
    totals[k] = (totals[k] || 0) + e.amount;
  });
  const keys = new Set(Object.keys(totals));
  const now = new Date();
  keys.add(viewMode === 'month' ? monthKey(now) : String(now.getFullYear()));
  keys.add(viewMode === 'month' ? currentMonth : currentYear);

  const active = viewMode === 'month' ? currentMonth : currentYear;
  menu.innerHTML = [...keys].sort().reverse().map(k => `
    <button data-p="${k}" aria-current="${k === active}">
      ${viewMode === 'month' ? labelFor(k) : k}<span class="num">${totals[k] ? '₹' + money(totals[k]) : '—'}</span>
    </button>`).join('');

  menu.querySelectorAll('button').forEach(b => b.onclick = () => {
    if (viewMode === 'month') currentMonth = b.dataset.p; else { currentYear = b.dataset.p; ySelMonth = null; ySelCat = null; }
    activeDate = null; document.getElementById('dateInput').value = ''; openCat = null; filterCat = null;
    menu.classList.remove('open');
    periodBtn.setAttribute('aria-expanded', false);
    render();
  });
};

});

// says, in rupees and months, exactly what the choice will do
function updateKindPreview(){
  const out = document.getElementById('kindOut');
  const otNote = 'kept out of the monthly budget';
  if (pickedKind !== 'split'){ out.textContent = pickedOneTime ? `One-time — ${otNote}` : ''; return; }
  const amt = evalExpr(amtIn.value);
  const n = clampMonths(monthsIn().value);
  const v = document.getElementById('when').value;
  const d0 = v ? new Date(v) : new Date();
  const end = new Date(d0.getFullYear(), d0.getMonth() + n - 1, 1);
  const span = `${MONTHS[d0.getMonth()].slice(0,3)} → ${MONTHS[end.getMonth()].slice(0,3)} ${String(end.getFullYear()).slice(2)}`;
  out.textContent = (amt && amt > 0
    ? `₹${money(Math.round(amt / n * 100) / 100)} a month for ${n} months · ${span}`
    : `${n} equal monthly parts · ${span}`) + (pickedOneTime ? ` · one-time, ${otNote}` : '');
}

// drag a sheet down to dismiss it — works from anywhere on the sheet once it is scrolled to the top
function enableSwipeClose(sheet){
  let startY = null, dy = 0, t0 = 0, dragging = false;
  sheet.addEventListener('touchstart', e => {
    if (!sheet.classList.contains('open') || sheet.scrollTop > 0) { startY = null; return; }
    startY = e.touches[0].clientY; dy = 0; t0 = Date.now(); dragging = false;
  }, { passive: true });
  sheet.addEventListener('touchmove', e => {
    if (startY === null) return;
    dy = e.touches[0].clientY - startY;
    if (!dragging){
      if (dy < 6) { if (dy < -6) startY = null; return; }   // an upward swipe is a scroll, leave it alone
      dragging = true;
      sheet.classList.add('dragging');
      if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
    }
    e.preventDefault();
    sheet.style.transform = `translateY(${Math.max(dy, 0)}px)`;
  }, { passive: false });
  const end = () => {
    if (startY === null) return;
    const flick = dy > 45 && (Date.now() - t0) < 260;
    sheet.classList.remove('dragging');
    sheet.style.transform = '';
    if (dragging && (dy > 110 || flick)) closeSheets();
    startY = null; dy = 0; dragging = false;
  };
  sheet.addEventListener('touchend', end);
  sheet.addEventListener('touchcancel', end);
}
document.querySelectorAll('.sheet').forEach(enableSwipeClose);

function drawChips(){
  const box = document.getElementById('catChips');
  box.innerHTML = allCats().map(c => `
    <button type="button" class="chip" data-cat="${esc(c)}" aria-pressed="${pickedCat === c}">
      <i class="dot" style="background:${pickedCat === c ? '#fff' : colorFor(c)};margin-top:0"></i>${esc(c)}
    </button>`).join('')
    + `<button type="button" class="chip" data-cat="__other" aria-pressed="${pickedCat === '__other'}">Other</button>`;
  box.querySelectorAll('.chip').forEach(b => b.addEventListener('click', () => {
    pickedCat = b.dataset.cat;
    if (!editingId && !kindTouched){
      const last = db.expenses.filter(e => e.category === pickedCat).sort((a,b) => touched(b) - touched(a))[0];
      setOneTime(!!(last && isOneTimeEntry(last)), false);

    }
    newCat.hidden = pickedCat !== '__other';
    if (pickedCat === '__other'){ newCat.value = ''; newCat.focus(); }
    drawChips();
  }, { once: true }));
}

  document.getElementById('sheetTitle').textContent = existing ? 'Edit expense' : 'Add expense';

  pickedMode = existing ? existing.mode : null;
  amtIn.value = existing ? String(existing.amount) : '';

  document.getElementById('calcOut').className = 'calcout';
  newCat.value = ''; newCat.hidden = true;

/* ---- tiny calculator: + - * / and brackets, normal BODMAS ---- */
function evalExpr(raw){
  let s = String(raw).replace(/^\s*=/,'').replace(/[×xX]/g,'*').replace(/÷/g,'/')
                     .replace(/[−–]/g,'-').replace(/,/g,'').trim();
  if (!s) return null;
  if (!/^[0-9+\-*/(). ]+$/.test(s)) return null;
  const tk = s.match(/\d+\.?\d*|[+\-*/()]/g);
  if (!tk) return null;
  let i = 0;
  const peek = () => tk[i];
  function expr(){
    let v = term();
    while (peek() === '+' || peek() === '-'){
      const op = tk[i++], r = term();
      if (v === null || r === null) return null;
      v = op === '+' ? v + r : v - r;
    }
    return v;
  }
  function term(){
    let v = factor();
    while (peek() === '*' || peek() === '/'){
      const op = tk[i++], r = factor();
      if (v === null || r === null || (op === '/' && r === 0)) return null;
      v = op === '*' ? v * r : v / r;
    }
    return v;
  }
  function factor(){
    if (peek() === '-'){ i++; const v = factor(); return v === null ? null : -v; }
    if (peek() === '+'){ i++; return factor(); }
    if (peek() === '('){ i++; const v = expr(); if (tk[i] !== ')') return null; i++; return v; }
    const t = tk[i];
    if (t === undefined || !/^\d/.test(t)) return null;
    i++; return parseFloat(t);
  }
  const val = expr();
  if (val === null || i !== tk.length || !isFinite(val)) return null;
  return Math.round(val * 100) / 100;
}

const isExpression = (v) => /^\s*=/.test(v) || /[+\-*/()×÷]/.test(String(v).slice(1));

function updateCalc(){
  const out = document.getElementById('calcOut');
  const v = amtIn.value;
  if (!isExpression(v)){ out.textContent = ''; out.className = 'calcout'; return; }
  const r = evalExpr(v);
  if (r === null){ out.textContent = 'Incomplete expression'; out.className = 'calcout bad'; }
  else { out.textContent = '= ₹' + money(r); out.className = 'calcout ok'; }
}
amtIn.addEventListener('input', updateCalc);

document.querySelectorAll('.calckey').forEach(k => k.onclick = () => {
  const el = amtIn;
  const a = el.selectionStart ?? el.value.length;
  const b = el.selectionEnd ?? a;
  if (k.dataset.k === 'back'){
    if (a === b && a > 0) el.value = el.value.slice(0, a-1) + el.value.slice(a);
    else el.value = el.value.slice(0, a) + el.value.slice(b);
    var pos = a === b ? Math.max(0, a-1) : a;
  } else {
    el.value = el.value.slice(0, a) + k.dataset.k + el.value.slice(b);
    var pos = a + 1;
  }
  el.focus();
  try { el.setSelectionRange(pos, pos); } catch(e){}
  updateCalc();
});

const fail = (msg) => { errEl.textContent = msg; };

saveBtn.addEventListener('click', () => {
  if (saving) return;

  const amount = evalExpr(amtIn.value);
  if (amount === null) return fail('That expression is incomplete — check the brackets and operators.');
  if (amount <= 0) return fail('Enter an amount greater than zero.');
  if (!pickedCat) return fail('Pick a category.');

  let category = pickedCat, newCategoryToAdd = null;
  if (pickedCat === '__other'){
    category = newCat.value.trim().replace(/\s+/g,' ');
    if (!category) return fail('Name the new category.');
    const existing = allCats().find(c => c.toLowerCase() === category.toLowerCase());
    if (existing) category = existing; else newCategoryToAdd = category;
  }
  if (!pickedMode) return fail('Choose how you paid.');

  const whenVal = document.getElementById('when').value;
  const ts = whenVal ? new Date(whenVal).getTime() : Date.now();
  const note = document.getElementById('note').value.trim();

  const kind = pickedKind;
  const oneTime = pickedOneTime;

  const months = kind === 'split' ? clampMonths(monthsIn().value) : undefined;

  const dupe = !editingId && db.expenses.find(e =>
    e.amount === amount && e.category === category && e.mode === pickedMode &&
    (e.note || '') === note && Math.abs(e.ts - ts) < 2000);
  if (dupe){ closeSheets(); toast('Already saved'); return; }

  saving = true;
  saveBtn.disabled = true;
  if (newCategoryToAdd) db.customCats.push(newCategoryToAdd);

  if (editingId){
    const e = db.expenses.find(x => x.id === editingId);
    if (e){
      Object.assign(e, { amount, category, mode: pickedMode, ts, note, kind, updatedAt: Date.now() });
      if (months) e.months = months; else delete e.months;
      if (oneTime) e.oneTime = true; else delete e.oneTime;

    }
  } else {
    const rec = { id: `${ts}-${Math.random().toString(36).slice(2,8)}`, amount, category, mode: pickedMode, ts, note, kind, updatedAt: Date.now() };
    if (months) rec.months = months;
    if (oneTime) rec.oneTime = true;

    db.expenses.push(rec);
  }
  save();

  const d = new Date(ts);
  if (viewMode === 'month') currentMonth = monthKey(d); else currentYear = String(d.getFullYear());
  const wasEdit = !!editingId;
  editingId = null;
  closeSheets();
  render();
  toast(wasEdit ? 'Changes saved'
      : kind === 'split' ? `₹${money(amount)} split over ${months} months${oneTime ? ' · one-time' : ''}`
      : oneTime ? `₹${money(amount)} recorded as one-time`
      : `₹${money(amount)} recorded`);
});

/* ============ detail ============ */
function countsAs(e){
  const ot = isOneTimeEntry(e);
  if (kindOf(e) !== 'split') return ot ? 'One-time, paid this month' : isFixed(e) ? 'This month · recurring' : 'This month';
  const d0 = new Date(e.ts), end = new Date(d0.getFullYear(), d0.getMonth() + e.months - 1, 1);
  return `${ot ? 'One-time · ' : ''}₹${money(Math.round(e.amount / e.months * 100) / 100)} a month × ${e.months}<span class="sub">${shortLabel(monthKey(d0))} → ${shortLabel(monthKey(end))}</span>`;
}
let detailId = null;
function openDetail(id){
  const e = db.expenses.find(x => x.id === id);
  if (!e) return;
  detailId = id;
  document.getElementById('detailTitle').textContent = `₹${money(e.amount)} · ${e.category}`;
  document.getElementById('detailBody').innerHTML = `

    ${e.note ? `<div class="detail-line"><span>Comment</span><b>${esc(e.note)}</b></div>` : ''}`;
  openSheet(detailSheet);
}
document.getElementById('deleteBtn').onclick = () => {
  const gone = db.expenses.find(x => x.id === detailId);
  db.expenses = db.expenses.filter(x => x.id !== detailId);
  save(); closeSheets(); render();
  toast(gone && kindOf(gone) === 'split' ? `Deleted — all ${gone.months} months removed` : 'Expense deleted');
};

/* ============ backup and restore ============ */
async function doBackup(){
  const name = `kharcha-paani-${new Date().toISOString().slice(0,10)}.json`;
  const json = JSON.stringify({ ...db, lastBackup: Date.now() }, null, 2);
  const blob = new Blob([json], { type:'application/json' });
  let done = false;
  try {
    const file = new File([blob], name, { type:'application/json' });
    if (navigator.canShare && navigator.canShare({ files:[file] })){
      await navigator.share({ files:[file], title:'Kharcha Paani backup' });
      done = true;
    }
  } catch(e){ if (e && e.name === 'AbortError') return; }
  if (!done){
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = name;
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1500);
  }
  db.lastBackup = Date.now();
  save(); renderBanners(); toast('Backup saved');
}
document.getElementById('exportBtn').onclick = doBackup;
document.getElementById('importBtn').onclick = () => document.getElementById('importFile').click();
document.getElementById('importFile').onchange = (ev) => {
  const f = ev.target.files[0];
  if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    const incoming = loadFrom(r.result);
    if (!incoming){ toast('That file is not a backup'); return; }
    const before = db.expenses.length;
    mergeInto(db, incoming);
    migrate();
    save(); render();
    toast(`${db.expenses.length - before} entries restored`);
  };
  r.readAsText(f);
  ev.target.value = '';
};
