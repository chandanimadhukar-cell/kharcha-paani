<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#FBF9F4">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Kharcha Paani">
<title>Kharcha Paani</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FBF9F4;
    --card:#FFFFFF;
    --ink:#1B1E2B;
    --ink-soft:#6B7183;
    --rule:#E6E1D6;
    --rule-soft:#F0ECE3;
    --red:#D42D20;
    --amber:#B87400;
    --green:#0F8A4D;
    --focus:#3B82F6;
    --radius:14px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    font-size:15px;line-height:1.45;
    -webkit-font-smoothing:antialiased;
    padding-bottom:calc(96px + env(safe-area-inset-bottom));
  }
  button,input,select{font:inherit;color:inherit}
  button{cursor:pointer;border:none;background:none}
  :focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:6px}
  .num{font-variant-numeric:tabular-nums}

  header{
    position:sticky;top:0;z-index:20;background:var(--paper);
    padding:calc(14px + env(safe-area-inset-top)) 18px 12px;
    border-bottom:1px solid var(--rule-soft);
  }
  .bar{display:flex;align-items:center;justify-content:space-between;gap:8px}
  .wordmark{font-family:'Fraunces',Georgia,serif;font-size:17px;letter-spacing:-.01em;white-space:nowrap}
  .controls{display:flex;align-items:center;gap:8px}
  .toggle{display:flex;background:var(--rule-soft);border-radius:999px;padding:3px}
  .toggle button{padding:6px 11px;border-radius:999px;font-size:12.5px;font-weight:500;color:var(--ink-soft)}
  .toggle button[aria-pressed="true"]{background:var(--card);color:var(--ink);font-weight:600;box-shadow:0 1px 3px rgba(27,30,43,.12)}
  .period-btn{
    display:flex;align-items:center;gap:6px;
    border:1px solid var(--rule);background:var(--card);
    padding:7px 11px;border-radius:999px;font-size:13.5px;font-weight:500;white-space:nowrap;
  }
  .period-btn svg{opacity:.5}

  .zone{font-weight:600}
  .ticker{color:var(--ink-soft);white-space:nowrap}
  .total.high .zone{color:var(--red)}
  .total.mid .zone{color:var(--amber)}
  .total.low .zone{color:var(--green)}

  .menu{
    position:absolute;right:18px;top:calc(58px + env(safe-area-inset-top));
    background:var(--card);border:1px solid var(--rule);border-radius:12px;
    box-shadow:0 12px 30px rgba(27,30,43,.13);
    padding:6px;min-width:180px;max-height:56vh;overflow:auto;display:none;
  }
  .menu.open{display:block}
  .menu button{display:flex;width:100%;justify-content:space-between;gap:14px;align-items:baseline;padding:9px 11px;border-radius:8px;text-align:left;font-size:14.5px}
  .menu button[aria-current="true"]{background:#F2EFE6;font-weight:600}
  .menu button span{color:var(--ink-soft);font-size:12.5px}

  main{padding:0 18px}
  section{padding:26px 0 4px;border-bottom:1px solid var(--rule-soft)}
  section:last-of-type{border-bottom:none}
  h2{font-size:13.5px;font-weight:600;margin:0 0 16px;color:var(--ink-soft)}

  .subtotal{font-size:13px;color:var(--ink-soft);margin-top:7px}
  .subtotal b{color:var(--ink);font-variant-numeric:tabular-nums}
  .tag{font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-soft);border:1px solid var(--rule);padding:1px 6px;border-radius:999px;margin-left:7px;vertical-align:middle}

  /* ---- donut ---- */
  .viz{text-align:center;padding-top:22px}
  .donut-wrap{position:relative;width:186px;height:186px;margin:0 auto}
  .donut-wrap svg{width:100%;height:100%;display:block}
  .seg{cursor:pointer;transition:opacity .2s,stroke-width .2s}
  .seg.off{opacity:.2}
  .seg.on{stroke-width:26}
  .seg.rest{cursor:default}
  .donut-center{position:absolute;inset:34px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px}
  .dc-amt{font-family:'Fraunces',Georgia,serif;line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
  .dc-lbl{font-size:11.5px;color:var(--ink-soft);line-height:1.25;max-width:104px}
  .total.high .dc-amt{color:var(--red);font-weight:600}
  .total.mid .dc-amt{color:var(--amber)}
  .total.low .dc-amt{color:var(--green)}
  .total .meta{color:var(--ink-soft);font-size:13px;margin-top:16px}
  .zoneline{font-size:13.5px;margin-top:7px;font-weight:500}
  .total.high .zoneline{color:var(--red)}
  .total.mid .zoneline{color:var(--amber)}
  .total.low .zoneline{color:var(--green)}
  .trend{width:100%;height:auto;display:block;margin-top:4px}
  .tpt{cursor:pointer}
  .hint{color:var(--ink-soft);font-size:13.5px;padding:10px 0 20px;max-width:40ch;line-height:1.6}

  /* ---- category rows ---- */
  .row{border-bottom:1px solid var(--rule-soft)}
  .row:last-child{border-bottom:none}
  .row-head{display:flex;width:100%;align-items:center;justify-content:space-between;gap:10px;padding:13px 0;text-align:left}
  .r-left{display:flex;align-items:center;gap:8px;font-size:14.5px;font-weight:500;min-width:0}
  .r-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .r-left .dot{margin-top:0}
  .r-right{display:flex;align-items:baseline;gap:9px;flex:none}
  .r-pct{font-size:12px;color:var(--ink-soft);font-variant-numeric:tabular-nums;min-width:30px;text-align:right}
  .r-right b{font-variant-numeric:tabular-nums;font-size:14px;min-width:66px;text-align:right}
  .g-count{font-size:11px;color:var(--ink-soft);border:1px solid var(--rule);border-radius:999px;padding:0 6px;font-weight:500;flex:none}
  .panel{padding:0 0 14px;animation:drop .18s ease}
  @keyframes drop{from{opacity:0;transform:translateY(-3px)}to{opacity:1;transform:none}}
  .panel-foot{display:flex;justify-content:flex-end;padding-top:10px}
  .pill-btn{font-size:12px;padding:6px 11px;border-radius:999px;border:1px solid var(--rule);background:var(--card);color:var(--ink-soft);white-space:nowrap}
  .pill-btn[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
  .chev{display:inline-block;color:var(--ink-soft);font-size:17px;line-height:1;transform:rotate(90deg);transition:transform .18s}
  .chev.open{transform:rotate(-90deg)}
  .divider{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-soft);border-top:1px solid var(--rule);padding-top:15px;margin-top:6px;font-weight:600}
  .when-row{display:flex;align-items:center;justify-content:space-between;gap:10px;border:1px solid var(--rule);background:var(--card);border-radius:11px;padding:10px 10px 10px 13px}
  .pencil{width:36px;height:36px;flex:none;border-radius:9px;border:1px solid var(--rule);display:flex;align-items:center;justify-content:center;font-size:15px}
  .pencil[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}

  .tbl{width:100%;border-collapse:collapse;table-layout:fixed}
  .tbl th{text-align:left;font-size:11px;font-weight:600;color:var(--ink-soft);padding:0 6px 8px 0;border-bottom:1px solid var(--rule)}
  .tbl th:last-child,.tbl td:last-child{text-align:right;padding-right:0}
  .tbl td{padding:11px 6px 11px 0;border-bottom:1px solid var(--rule-soft);font-size:13px;vertical-align:top;word-break:break-word}
  .tbl tr:last-child td{border-bottom:none}
  .c-date,.c-cat,.c-amt{width:33.33%}
  .cat-cell{display:flex;align-items:flex-start;gap:6px}
  .dot{width:8px;height:8px;border-radius:50%;flex:none;margin-top:5px}
  .sub{display:block;color:var(--ink-soft);font-size:11.5px;margin-top:2px}
  .dash{color:var(--rule)}
  .tbl tbody tr{cursor:pointer}
  .amt{font-variant-numeric:tabular-nums;font-weight:500;white-space:nowrap;font-size:13.5px}

  .filters{display:flex;align-items:center;gap:7px;margin-bottom:18px}
  .selpill{flex:1;min-width:0;border:1px solid var(--rule);background:var(--card);border-radius:999px;padding:7px 11px;font-size:12.5px;color:var(--ink);-webkit-appearance:none;appearance:none;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='11' height='7'><path d='M1 1l4.5 4.5L10 1' stroke='%236B7183' stroke-width='1.6' fill='none' stroke-linecap='round'/></svg>");
    background-repeat:no-repeat;background-position:right 11px center;padding-right:28px}
  .selpill[data-on="true"],.datepill[data-on="true"]{background-color:var(--ink);color:#fff;border-color:var(--ink)}
  .date-filter{display:flex;align-items:center;gap:6px}
  .datepill{border:1px solid var(--rule);background:var(--card);border-radius:999px;padding:6px 11px;font-size:12.5px;color:var(--ink);min-width:0}
  .x-btn{border:1px solid var(--rule);background:var(--card);border-radius:999px;width:28px;height:28px;font-size:13px;color:var(--ink-soft)}
  .tbl.grp{margin:0 0 12px}
  .tbl.grp td{font-size:13px;padding:9px 6px 9px 0;border-bottom:1px solid var(--rule-soft)}
  .tbl.grp tr:last-child td{border-bottom:none}
  .empty{color:var(--ink-soft);font-size:14px;padding:14px 0 18px;max-width:42ch}
  .note-line{font-size:12.5px;color:var(--ink-soft);padding:18px 0 0;line-height:1.7}
  .note-line button{text-decoration:underline;font-size:12.5px;color:var(--ink-soft);padding:0}

  .banner{margin:20px 0 0;padding:12px 14px;border-radius:12px;font-size:13px;line-height:1.5;display:flex;gap:12px;align-items:center;justify-content:space-between}
  .banner.warn{background:#FFF4E0;border:1px solid #FFD79A;color:#7A4E00}
  .banner.info{background:#FFFDF7;border:1px dashed var(--rule);color:var(--ink-soft)}
  .banner button{background:var(--ink);color:#fff;border-radius:9px;padding:8px 12px;font-size:13px;font-weight:600;white-space:nowrap}

  .add{
    position:fixed;left:18px;right:18px;bottom:calc(18px + env(safe-area-inset-bottom));z-index:30;
    background:var(--ink);color:#fff;border-radius:var(--radius);
    padding:16px;font-size:15.5px;font-weight:600;text-align:center;
    box-shadow:0 8px 24px rgba(27,30,43,.22);
  }
  .add:active{transform:translateY(1px)}

  .scrim{position:fixed;inset:0;background:rgba(27,30,43,.34);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
  .scrim.open{opacity:1;pointer-events:auto}
  .sheet{
    position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--paper);
    border-radius:20px 20px 0 0;padding:8px 18px calc(20px + env(safe-area-inset-bottom));
    max-height:92vh;overflow:auto;transform:translateY(102%);
    transition:transform .26s cubic-bezier(.2,.8,.25,1);
  }
  .sheet.open{transform:translateY(0)}
  .grab{width:38px;height:4px;border-radius:2px;background:var(--rule);margin:8px auto 16px}
  .sheet h3{margin:0 0 18px;font-size:17px;font-family:'Fraunces',Georgia,serif;font-weight:600}
  .field{margin-bottom:20px}
  .field > label{display:block;font-size:12.5px;color:var(--ink-soft);margin-bottom:9px;font-weight:500}
  .amount-wrap{display:flex;align-items:flex-end;gap:8px;border-bottom:2px solid var(--ink)}
  .amount-wrap .sym{font-family:'Fraunces',Georgia,serif;font-size:26px;opacity:.5;padding-bottom:10px}
  .amount-in{width:100%;border:none;background:transparent;font-family:'Fraunces',Georgia,serif;font-size:36px;padding:0 0 8px;font-variant-numeric:tabular-nums;border-radius:0}
  .amount-in:focus{outline:none}
  .calcbar{display:flex;gap:6px;margin-top:10px}
  .calckey{flex:1;border:1px solid var(--rule);background:var(--card);border-radius:9px;padding:10px 0;font-size:16px;text-align:center;color:var(--ink)}
  .calckey:active{background:var(--rule-soft)}
  .calcout{font-size:13px;margin-top:9px;min-height:18px;font-variant-numeric:tabular-nums}
  .calcout.ok{color:var(--green);font-weight:600}
  .calcout.bad{color:var(--red)}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{border:1px solid var(--rule);background:var(--card);padding:9px 13px;border-radius:999px;font-size:14px;display:flex;align-items:center;gap:7px}
  .chip[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
  .modes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .mode{border:1px solid var(--rule);background:var(--card);padding:12px 6px;border-radius:11px;font-size:13.5px;text-align:center}
  .mode[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
  .dt{width:100%;border:1px solid var(--rule);background:var(--card);border-radius:11px;padding:12px}
  .txt{width:100%;border:1px solid var(--rule);background:var(--card);border-radius:11px;padding:12px;margin-top:8px}
  .save{width:100%;background:var(--ink);color:#fff;border-radius:var(--radius);padding:16px;font-size:15.5px;font-weight:600;margin-top:4px}
  .save[disabled]{opacity:.4}
  .cancel{width:100%;padding:14px;font-size:14px;color:var(--ink-soft);margin-top:4px}
  .err{color:var(--red);font-size:13px;margin-top:10px;min-height:18px}
  .edit{width:100%;background:var(--ink);color:#fff;border-radius:var(--radius);padding:15px;font-size:15px;font-weight:600;margin-bottom:10px}
  .del{width:100%;border:1px solid var(--rule);color:var(--red);border-radius:var(--radius);padding:15px;font-size:15px;font-weight:600}
  .detail-line{display:flex;justify-content:space-between;gap:16px;padding:11px 0;border-bottom:1px solid var(--rule-soft);font-size:14.5px}
  .detail-line span:first-child{color:var(--ink-soft);white-space:nowrap}
  .detail-line b{text-align:right}
  .toast{
    position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translate(-50%,14px);
    background:var(--ink);color:#fff;padding:11px 16px;border-radius:999px;font-size:13.5px;
    z-index:60;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;
  }
  .toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>

<header>
  <div class="bar">
    <div class="wordmark">Kharcha Paani</div>
    <div class="controls">
      <div class="toggle" id="viewToggle">
        <button data-view="month" aria-pressed="true">Month</button>
        <button data-view="year" aria-pressed="false">Year</button>
      </div>
      <button class="period-btn" id="periodBtn" aria-haspopup="true" aria-expanded="false">
        <span id="periodLabel">—</span>
        <svg width="11" height="7" viewBox="0 0 11 7" fill="none"><path d="M1 1l4.5 4.5L10 1" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      </button>
    </div>
  </div>
  <div class="menu" id="periodMenu" role="menu"></div>
</header>

<main>
  <section class="viz total" id="totalBox">
    <div class="donut-wrap" id="donutWrap">
      <svg viewBox="0 0 200 200" id="donut" aria-label="Spend by category"></svg>
      <div class="donut-center">
        <div class="dc-amt num" id="centerAmt">₹0</div>
        <div class="dc-lbl" id="centerLbl"></div>
      </div>
    </div>
    <div id="trendWrap" hidden></div>
    <div class="meta" id="totalMeta">No expenses yet</div>
    <div class="zoneline" id="zoneLine"></div>
    <div class="subtotal" id="subtotal"></div>
  </section>

  <section>
    <div class="filters">
      <select class="selpill" id="catFilter" aria-label="Filter by category"></select>
      <input type="date" id="dateInput" class="datepill" aria-label="Filter by date">
      <button class="x-btn" id="clearFilters" hidden aria-label="Clear filters">✕</button>
    </div>
    <div id="listWrap"></div>
    <div id="banners"></div>
    <div class="note-line">
      <span id="incomeState"></span> <button id="editIncome">Change</button><br>
      <span id="backupState">Data lives on this phone.</span><br>
      <button id="exportBtn">Back up now</button> ·
      <button id="importBtn">Restore from backup</button>
      <input type="file" id="importFile" accept="application/json,.json" hidden>
    </div>
  </section>
</main>

<button class="add" id="addBtn">+ Add expense</button>
<div class="toast" id="toast"></div>
<div class="scrim" id="scrim"></div>

<div class="sheet" id="addSheet" role="dialog" aria-modal="true" aria-label="Add expense">
  <div class="grab"></div>
  <h3 id="sheetTitle">Add expense</h3>

  <div class="field">
    <label for="amt">Amount</label>
    <div class="amount-wrap">
      <span class="sym">₹</span>
      <input class="amount-in num" id="amt" type="text" inputmode="decimal" placeholder="0 or =69+61+52" autocomplete="off">
    </div>
    <div class="calcbar">
      <button type="button" class="calckey" data-k="+">+</button>
      <button type="button" class="calckey" data-k="-">−</button>
      <button type="button" class="calckey" data-k="*">×</button>
      <button type="button" class="calckey" data-k="/">÷</button>
      <button type="button" class="calckey" data-k="(">(</button>
      <button type="button" class="calckey" data-k=")">)</button>
      <button type="button" class="calckey" data-k="back">⌫</button>
    </div>
    <div class="calcout" id="calcOut"></div>
  </div>

  <div class="field">
    <label>Category</label>
    <div class="chips" id="catChips"></div>
    <input class="txt" id="newCat" placeholder="Name this category" hidden autocomplete="off" maxlength="30">
  </div>

  <div class="field">
    <label>Paid by</label>
    <div class="modes" id="modes">
      <button class="mode" data-mode="UPI" aria-pressed="false">UPI</button>
      <button class="mode" data-mode="Card" aria-pressed="false">Card</button>
      <button class="mode" data-mode="Cash" aria-pressed="false">Cash</button>
    </div>
  </div>

  <div class="field">
    <label>When</label>
    <div class="when-row">
      <span id="whenText" class="num">—</span>
      <button type="button" class="pencil" id="whenEdit" aria-pressed="false" aria-label="Change date and time">✎</button>
    </div>
    <input class="dt" id="when" type="datetime-local" hidden style="margin-top:8px">
  </div>

  <div class="field">
    <label for="note">Comment <span style="opacity:.6">— optional</span></label>
    <input class="dt" id="note" placeholder="What was this for?" autocomplete="off" maxlength="140">
  </div>

  <div class="err" id="err"></div>
  <button class="save" id="saveBtn">Save expense</button>
  <button class="cancel" id="cancelBtn">Cancel</button>
</div>

<div class="sheet" id="incomeSheet" role="dialog" aria-modal="true" aria-label="Monthly income">
  <div class="grab"></div>
  <h3 id="incomeTitle">Monthly income</h3>
  <div class="field">
    <label for="incomeIn">Take-home income</label>
    <div class="amount-wrap">
      <span class="sym">₹</span>
      <input class="amount-in num" id="incomeIn" type="text" inputmode="decimal" autocomplete="off">
    </div>
    <div class="calcout ok" id="incomeOut"></div>
  </div>
  <p class="hint" id="incomeHint" style="padding-top:0"></p>
  <button class="save" id="incomeSave">Save</button>
  <button class="cancel" id="incomeCancel">Cancel</button>
</div>

<div class="sheet" id="detailSheet" role="dialog" aria-modal="true" aria-label="Expense details">
  <div class="grab"></div>
  <h3 id="detailTitle">Expense</h3>
  <div id="detailBody" style="margin-bottom:22px"></div>
  <button class="edit" id="editBtn">Edit expense</button>
  <button class="del" id="deleteBtn">Delete this expense</button>
  <button class="cancel" id="closeDetail">Close</button>
</div>

<script>
/* ============ storage: localStorage + IndexedDB mirror ============ */
const KEY = 'kharcha.v1';

const ls = (() => {
  let mem = {}, ok = true;
  try { localStorage.setItem('__k','1'); localStorage.removeItem('__k'); } catch(e){ ok = false; }
  return {
    ok,
    get(k){ try { return ok ? localStorage.getItem(k) : (mem[k] ?? null); } catch(e){ return mem[k] ?? null; } },
    set(k,v){ try { ok ? localStorage.setItem(k,v) : (mem[k]=v); } catch(e){ mem[k]=v; } }
  };
})();

const idb = {
  open(){
    return new Promise(res => {
      try {
        const r = indexedDB.open('kharchaPaani', 1);
        r.onupgradeneeded = () => { if (!r.result.objectStoreNames.contains('kv')) r.result.createObjectStore('kv'); };
        r.onsuccess = () => res(r.result);
        r.onerror = () => res(null);
      } catch(e){ res(null); }
    });
  },
  async get(k){
    const d = await this.open(); if (!d) return null;
    return new Promise(res => {
      try { const q = d.transaction('kv','readonly').objectStore('kv').get(k);
        q.onsuccess = () => res(q.result ?? null); q.onerror = () => res(null);
      } catch(e){ res(null); }
    });
  },
  async set(k,v){
    const d = await this.open(); if (!d) return;
    try { d.transaction('kv','readwrite').objectStore('kv').put(v,k); } catch(e){}
  }
};

const BASE_CATS = ['Rent','Rental','Groceries','Home Essentials','Personal Essentials','Shopping','Commute','Travel','Eating Out','Food Apps'];
const PALETTE = ['#FF5A5F','#BF8C00','#57C84D','#22B8CF','#7C5CFF','#F0508C','#3B82F6','#12B886','#FF7847','#9B4DE0','#8FBF3F','#00A6A6','#E8590C','#4DABF7','#B5179E','#7A6A4F'];
const REST_COLOR = '#9AA0AE';

const SAFE_PCT = 0.33;   // at or under a third of income: safe
const CAP_PCT  = 0.40;   // above 40% of income: over limit

let db = { expenses: [], customCats: [], excluded: [], income: 300000, incomes: {}, lastBackup: 0 };

function loadFrom(raw){
  try {
    const p = typeof raw === 'string' ? JSON.parse(raw) : raw;
    if (!p) return null;
    return {
      expenses: Array.isArray(p.expenses) ? p.expenses : [],
      customCats: Array.isArray(p.customCats) ? p.customCats : [],
      excluded: Array.isArray(p.excluded) ? p.excluded : [],
      income: Number(p.income) > 0 ? Number(p.income) : 300000,
      incomes: (p.incomes && typeof p.incomes === 'object') ? p.incomes : {},
      lastBackup: p.lastBackup || 0
    };
  } catch(e){ return null; }
}
const loaded = loadFrom(ls.get(KEY));
if (loaded) db = loaded;

function mergeInto(target, incoming){
  if (!incoming) return false;
  let changed = false;
  const seen = new Set(target.expenses.map(x => x.id));
  incoming.expenses.forEach(x => { if (x && x.id && !seen.has(x.id)){ target.expenses.push(x); seen.add(x.id); changed = true; } });
  incoming.customCats.forEach(c => { if (!target.customCats.includes(c) && !BASE_CATS.includes(c)){ target.customCats.push(c); changed = true; } });
  incoming.excluded.forEach(c => { if (!target.excluded.includes(c)){ target.excluded.push(c); changed = true; } });
  if (incoming.income && incoming.income !== target.income){ target.income = incoming.income; changed = true; }
  Object.entries(incoming.incomes || {}).forEach(([k,v]) => {
    if (v > 0 && target.incomes[k] !== v){ target.incomes[k] = v; changed = true; }
  });
  if (incoming.lastBackup > target.lastBackup) target.lastBackup = incoming.lastBackup;
  return changed;
}

function save(){
  db.customCats = db.customCats.filter((c,i) => !BASE_CATS.includes(c) && db.customCats.indexOf(c) === i);
  const json = JSON.stringify(db);
  ls.set(KEY, json);
  idb.set(KEY, json);
}

const allCats = () => BASE_CATS.concat(db.customCats);
const isOneTime = (cat) => db.excluded.includes(cat);
const colorFor = (cat) => {
  const list = allCats();
  const i = list.indexOf(cat);
  return PALETTE[(i < 0 ? list.length : i) % PALETTE.length];
};

/* ============ helpers ============ */
const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const monthKey = (d) => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
const labelFor = (k) => { const [y,m] = k.split('-'); return `${MONTHS[+m-1]} ${y}`; };
const shortLabel = (k) => { const [y,m] = k.split('-'); return `${MONTHS[+m-1].slice(0,3)} ${y.slice(2)}`; };
const money = (n) => n.toLocaleString('en-IN', { maximumFractionDigits: n % 1 ? 2 : 0, minimumFractionDigits: n % 1 ? 2 : 0 });
const fmtDate = (ts) => new Date(ts).toLocaleDateString('en-IN',{ day:'numeric', month:'short' });
const fmtTime = (ts) => new Date(ts).toLocaleTimeString('en-IN',{ hour:'numeric', minute:'2-digit', hour12:true });
const localInput = (d) => { const p = n => String(n).padStart(2,'0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`; };
const dayKey = (ts) => { const d = new Date(ts); const p = n => String(n).padStart(2,'0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`; };
const esc = (s) => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

let viewMode = 'month';
let openCat = null;        // the one expanded category, or null
let filterCat = null;      // category filter — the picker and the donut share it
let activeDate = null;
let currentMonth = monthKey(new Date());
let currentYear = String(new Date().getFullYear());

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 2400);
}

/* ============ period ============ */
function inPeriod(){
  return db.expenses.filter(e => {
    const d = new Date(e.ts);
    return viewMode === 'month'
      ? monthKey(d) === currentMonth
      : String(d.getFullYear()) === currentYear;
  }).sort((a,b) => b.ts - a.ts);
}
const periodName = () => viewMode === 'month' ? labelFor(currentMonth) : currentYear;

// income applies from the month it was set onwards, the way a salary actually works
function incomeFor(mk){
  const keys = Object.keys(db.incomes || {}).filter(k => k <= mk).sort();
  if (keys.length) return db.incomes[keys[keys.length - 1]];
  return db.income > 0 ? db.income : 300000;
}
function trackedMonths(){
  const seen = new Set();
  db.expenses.forEach(e => {
    const d = new Date(e.ts);
    if (String(d.getFullYear()) === currentYear) seen.add(monthKey(d));
  });
  return [...seen].sort();
}
// the two lines that define the zones, for whatever period is on screen
function budgetLines(){
  if (viewMode === 'month'){
    const inc = incomeFor(currentMonth);
    return { income: inc, safe: inc * SAFE_PCT, cap: inc * CAP_PCT, months: 1 };
  }
  const ms = trackedMonths();
  const sum = ms.length ? ms.reduce((s,m) => s + incomeFor(m), 0) : incomeFor(`${currentYear}-01`);
  return { income: sum, safe: sum * SAFE_PCT, cap: sum * CAP_PCT, months: Math.max(ms.length, 1) };
}

function band(total){
  const { safe, cap } = budgetLines();
  if (total > cap) return 'high';
  if (total > safe) return 'mid';
  return 'low';
}
const ZONE = { high:'Over limit', mid:'⚠ Watch it', low:'Safe zone' };

// says where you stand against the budget — never a share of income
function zoneSentence(total){
  const { safe, cap } = budgetLines();
  const z = band(total);
  if (z === 'high') return `${ZONE.high} · ₹${money(Math.round(total - cap))} over your ₹${money(Math.round(cap))} budget`;
  if (z === 'mid')  return `${ZONE.mid} · ₹${money(Math.round(total - safe))} past the safe line · ₹${money(Math.round(cap - total))} left before the cap`;
  return `${ZONE.low} · ₹${money(Math.round(safe - total))} before the warning zone`;
}

function daysToReset(){
  const now = new Date();
  if (viewMode === 'month'){
    if (currentMonth !== monthKey(now)) return null;          // only for the running month
    const lastDay = new Date(now.getFullYear(), now.getMonth() + 1, 0).getDate();
    return lastDay - now.getDate();
  }
  if (currentYear !== String(now.getFullYear())) return null;
  const endOfYear = new Date(now.getFullYear(), 11, 31);
  const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  return Math.round((endOfYear - today) / 86400000);
}
const resetText = (n) => n === 0 ? 'last day' : `${n} day${n === 1 ? '' : 's'} to reset`;

/* ============ render ============ */
const DONUT_SLICES = 5;        // top N get their own colour; the tail folds into "Rest"
const MONTH_LETTER = ['J','F','M','A','M','J','J','A','S','O','N','D'];

function aggregate(list){
  const by = {};
  list.forEach(e => {
    const a = by[e.category] || (by[e.category] = { cat: e.category, total: 0, items: [], latest: 0 });
    a.total += e.amount;
    a.items.push(e);
    if (e.ts > a.latest) a.latest = e.ts;
  });
  return Object.values(by);
}

function donutHTML(cats, total){
  if (!total) return '';
  const R = 74, C = 2 * Math.PI * R;
  const big = [...cats].sort((a,b) => b.total - a.total);
  let parts = big.slice(0, DONUT_SLICES).map(c => ({ cat: c.cat, total: c.total, color: colorFor(c.cat) }));
  const tail = big.slice(DONUT_SLICES);
  if (tail.length) parts.push({ cat: null, total: tail.reduce((s,c) => s + c.total, 0), color: REST_COLOR });

  const gap = parts.length > 1 ? 3 : 0;
  let off = 0;
  const segs = parts.map(p => {
    const full = p.total / total * C;
    const len = Math.max(full - gap, 1.5);
    const cls = p.cat === null ? 'seg rest'
      : (filterCat === p.cat ? 'seg on' : (filterCat ? 'seg off' : 'seg'));
    const el = `<circle class="${cls}"${p.cat ? ` data-cat="${esc(p.cat)}"` : ''} r="${R}" cx="100" cy="100"
      fill="none" stroke="${p.color}" stroke-width="20"
      stroke-dasharray="${len.toFixed(2)} ${(C - len).toFixed(2)}" stroke-dashoffset="${(-off).toFixed(2)}"></circle>`;
    off += full;
    return el;
  }).join('');
  return `<g transform="rotate(-90 100 100)">${segs}</g>`;
}

/* ---- year view: one point per month, Jan to Dec ---- */
function trendHTML(){
  const W = 320, H = 168, L = 8, R = 8, T = 16, B = 24;
  const totals = Array(12).fill(0);
  let any = false;
  db.expenses.forEach(e => {
    const d = new Date(e.ts);
    if (String(d.getFullYear()) !== currentYear) return;
    if (filterCat ? e.category !== filterCat : isOneTime(e.category)) return;
    totals[d.getMonth()] += e.amount;
    any = true;
  });
  if (!any) return `<p class="empty">Nothing recorded in ${esc(currentYear)} yet.</p>`;

  const now = new Date();
  const last = String(now.getFullYear()) === currentYear ? now.getMonth() : 11;
  const first = totals.findIndex((v,i) => v > 0 && i <= last);   // start at the first tracked month
  const vals = totals.slice(first, last + 1);
  const bl = budgetLines();
  const limit = filterCat ? null : bl.cap / bl.months;          // the 40% cap, per month
  const peak = Math.max(...vals, limit || 0) * 1.12 || 1;

  const span = vals.length - 1;
  const x = i => L + (W - L - R) * (span === 0 ? 0.5 : i / span);
  const y = v => T + (H - T - B) * (1 - v / peak);
  const line = vals.map((v,i) => `${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
  const stroke = filterCat ? colorFor(filterCat) : '#3B82F6';

  const limitLine = limit ? `
    <line x1="${L}" y1="${y(limit).toFixed(1)}" x2="${W-R}" y2="${y(limit).toFixed(1)}"
      stroke="${'#D42D20'}" stroke-width="1" stroke-dasharray="4 4" opacity=".55"></line>
    <text x="${W-R}" y="${(y(limit)-5).toFixed(1)}" text-anchor="end" font-size="9" fill="#D42D20" opacity=".8">40% of income</text>` : '';

  const dots = vals.map((v,i) => `
    <circle class="tpt" data-m="${first + i}" cx="${x(i).toFixed(1)}" cy="${y(v).toFixed(1)}" r="4.5"
      fill="${stroke}" stroke="#FBF9F4" stroke-width="2"><title>${MONTHS[first + i]}: ₹${money(v)}</title></circle>`).join('');

  const lastVal = vals[vals.length - 1];
  const labelAnchor = span === 0 ? 'middle' : 'end';
  const peakLabel = `<text x="${x(vals.length-1).toFixed(1)}" y="${Math.max(y(lastVal) - 11, 10).toFixed(1)}"
      text-anchor="${labelAnchor}" font-size="10.5" fill="#1B1E2B" font-weight="600">₹${money(lastVal)}</text>`;

  const axis = vals.map((v,i) => `<text x="${x(i).toFixed(1)}" y="${H-7}" text-anchor="middle" font-size="9.5" fill="#6B7183">${MONTH_LETTER[first + i]}</text>`).join('');

  return `<svg class="trend" viewBox="0 0 ${W} ${H}" aria-label="Monthly spend across ${currentYear}">
    ${limitLine}
    <polyline points="${line}" fill="none" stroke="${stroke}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"></polyline>
    ${dots}${peakLabel}${axis}
  </svg>`;
}

/* ---- the category picker ---- */
function fillCatFilter(cats){
  const sel = document.getElementById('catFilter');
  const opts = ['<option value="">All categories</option>']
    .concat([...cats].sort((a,b) => b.total - a.total)
      .map(c => `<option value="${esc(c.cat)}">${esc(c.cat)}</option>`));
  sel.innerHTML = opts.join('');
  sel.value = filterCat && cats.some(c => c.cat === filterCat) ? filterCat : '';
  sel.dataset.on = !!sel.value;
}

function render(){
  const rows = inPeriod();
  const periodCounted = rows.filter(e => !isOneTime(e.category));
  const periodTotal = periodCounted.reduce((s,e) => s + e.amount, 0);

  // what the filters leave behind
  const dayRows = activeDate ? rows.filter(e => dayKey(e.ts) === activeDate) : rows;
  const counted = dayRows.filter(e => !isOneTime(e.category));
  const oneTime = dayRows.filter(e => isOneTime(e.category));
  const total = counted.reduce((s,e) => s + e.amount, 0);
  const oneTimeTotal = oneTime.reduce((s,e) => s + e.amount, 0);

  document.getElementById('periodLabel').textContent =
    viewMode === 'month' ? shortLabel(currentMonth) : currentYear;

  const countedCats = aggregate(counted).sort((a,b) => b.latest - a.latest);
  const oneTimeCats = aggregate(oneTime).sort((a,b) => b.latest - a.latest);
  const allCatsHere = [...countedCats, ...oneTimeCats];

  if (filterCat && !allCatsHere.some(c => c.cat === filterCat)) filterCat = null;
  fillCatFilter(allCatsHere);
  document.getElementById('dateInput').dataset.on = !!activeDate;
  document.getElementById('clearFilters').hidden = !filterCat && !activeDate;

  const sel = filterCat ? allCatsHere.find(c => c.cat === filterCat) : null;

  /* ---- chart: donut for a month, trend line for a year ---- */
  const donutWrap = document.getElementById('donutWrap');
  const trendWrap = document.getElementById('trendWrap');
  donutWrap.hidden = viewMode !== 'month';
  trendWrap.hidden = viewMode === 'month';

  if (viewMode === 'month'){
    document.getElementById('donut').innerHTML = donutHTML(countedCats, total);
    const shownAmt = sel ? sel.total : total;
    const amtStr = '₹' + money(shownAmt);
    const size = amtStr.length > 10 ? 19 : amtStr.length > 8 ? 22 : 26;
    const amtEl = document.getElementById('centerAmt');
    amtEl.textContent = amtStr;
    amtEl.style.fontSize = size + 'px';

    // the centre's caption: category gets its share, a date gets the date
    const dateLbl = activeDate ? fmtDate(new Date(activeDate + 'T00:00').getTime()) : '';
    let caption;
    if (sel){
      const denom = total || 1;
      const share = isOneTime(sel.cat) ? null : (sel.total / denom * 100);
      caption = sel.cat + (share === null ? ' · one-time' : ` · ${share.toFixed(share < 10 ? 1 : 0)}%`) + (dateLbl ? ' · ' + dateLbl : '');
    } else {
      caption = dateLbl || (viewMode === 'month' ? labelFor(currentMonth).split(' ')[0] : currentYear);
    }
    document.getElementById('centerLbl').textContent = caption;
  } else {
    trendWrap.innerHTML = trendHTML();
    trendWrap.querySelectorAll('.tpt').forEach(dot => dot.onclick = () => {
      currentMonth = `${currentYear}-${String(+dot.dataset.m + 1).padStart(2,'0')}`;
      viewMode = 'month';
      document.querySelectorAll('#viewToggle button').forEach(x => x.setAttribute('aria-pressed', x.dataset.view === 'month'));
      render();
    });
  }

  /* ---- meta, zone sentence, one-time note ---- */
  const dl = daysToReset();
  const ticker = dl === null ? '' : ` · <span class="ticker">${resetText(dl)}</span>`;
  const where = activeDate ? ' on ' + fmtDate(new Date(activeDate + 'T00:00').getTime()) : ' in ' + periodName();
  document.getElementById('totalMeta').innerHTML = dayRows.length
    ? `${counted.length} ${counted.length === 1 ? 'entry' : 'entries'}${where}${ticker}`
    : `Nothing recorded${where}${ticker}`;

  // the zone always judges the whole period, never one day or one category
  const z = band(periodTotal);
  document.getElementById('totalBox').className = 'viz total ' + (periodCounted.length ? z : '');
  document.getElementById('zoneLine').textContent = periodCounted.length ? zoneSentence(periodTotal) : '';
  document.getElementById('subtotal').innerHTML = oneTimeTotal
    ? `One-time costs: <b>₹${money(oneTimeTotal)}</b> — not counted above`
    : '';

  /* ---- the list: blank until a filter is chosen ---- */
  const wrap = document.getElementById('listWrap');
  if (!filterCat && !activeDate){
    wrap.innerHTML = `<p class="hint">Pick a category or a date — or tap a slice — to see the entries behind it.</p>`;
  } else {
    let listCats = filterCat ? allCatsHere.filter(c => c.cat === filterCat) : allCatsHere;
    if (!listCats.length){
      wrap.innerHTML = `<p class="hint">Nothing matches those filters.</p>`;
    } else {
      const rowHTML = (c) => {
        const one = isOneTime(c.cat);
        const open = openCat === c.cat;
        const pct = total ? c.total / total * 100 : 0;
        return `<div class="row">
          <button class="row-head" data-cat="${esc(c.cat)}" aria-expanded="${open}">
            <span class="r-left">
              <i class="dot" style="background:${colorFor(c.cat)}"></i>
              <span class="r-name">${esc(c.cat)}</span>
              <span class="g-count">${c.items.length}</span>
            </span>
            <span class="r-right">
              <span class="r-pct num">${one ? '' : pct.toFixed(pct < 10 ? 1 : 0) + '%'}</span>
              <b class="num">₹${money(c.total)}</b>
              <span class="chev${open ? ' open' : ''}">›</span>
            </span>
          </button>
          ${open ? `<div class="panel">
            <table class="tbl grp"><tbody>${c.items.map(e => `
              <tr data-id="${e.id}">
                <td class="num">${fmtDate(e.ts)}<span class="sub">${fmtTime(e.ts)}</span></td>
                <td>${esc(e.mode)}${e.note ? `<span class="sub">${esc(e.note)}</span>` : ''}</td>
                <td class="amt num">₹${money(e.amount)}</td>
              </tr>`).join('')}</tbody></table>
            <div class="panel-foot">
              <button class="pill-btn" data-ot="${esc(c.cat)}" aria-pressed="${one}">${one ? 'One-time ✓' : 'Mark as one-time'}</button>
            </div>
          </div>` : ''}
        </div>`;
      };

      // one category in view opens itself; several stay collapsed
      if (listCats.length === 1) openCat = listCats[0].cat;
      wrap.innerHTML = listCats.map(rowHTML).join('');

      wrap.querySelectorAll('.row-head').forEach(h => h.onclick = () => {
        openCat = openCat === h.dataset.cat ? null : h.dataset.cat;
        render();
      });
      wrap.querySelectorAll('tbody tr').forEach(tr => tr.onclick = () => openDetail(tr.dataset.id));
      wrap.querySelectorAll('.pill-btn').forEach(b => b.onclick = () => {
        const c = b.dataset.ot;
        const wasOne = isOneTime(c);
        db.excluded = wasOne ? db.excluded.filter(x => x !== c) : db.excluded.concat(c);
        save(); render();
        toast(wasOne ? `${c} counts towards the total again` : `${c} excluded from the total`);
      });
    }
  }

  /* ---- tapping a slice is the same as picking that category ---- */
  document.querySelectorAll('#donut .seg[data-cat]').forEach(seg => seg.onclick = () => {
    const c = seg.dataset.cat;
    filterCat = filterCat === c ? null : c;
    openCat = filterCat;
    render();
  });

  const bl = budgetLines();
  document.getElementById('incomeState').textContent = viewMode === 'month'
    ? `${labelFor(currentMonth).split(' ')[0]} budget ₹${money(Math.round(bl.cap))} — 40% of ₹${money(bl.income)} income.`
    : `${currentYear} budget ₹${money(Math.round(bl.cap))} across ${bl.months} tracked month${bl.months === 1 ? '' : 's'}.`;
  renderBanners();
}

const DAY = 86400000;
function renderBanners(){
  const box = document.getElementById('banners');
  let html = '';
  if (!ls.ok) html += `<div class="banner info">Preview mode — entries clear when you close this. Open the installed app to keep them.</div>`;

  const since = db.lastBackup ? Date.now() - db.lastBackup : null;
  const state = document.getElementById('backupState');
  if (!db.expenses.length) state.textContent = 'Data lives on this phone.';
  else if (!db.lastBackup) state.textContent = 'Never backed up.';
  else {
    const d = Math.floor(since / DAY);
    state.textContent = d < 1 ? 'Backed up today.' : `Last backup ${d} day${d === 1 ? '' : 's'} ago.`;
  }

  if (db.expenses.length && (!db.lastBackup || since > 7 * DAY)){
    html += `<div class="banner warn">
      <span>${db.lastBackup ? 'It has been over a week since your last backup.' : 'No backup yet. One tap saves a copy to iCloud Drive.'}</span>
      <button id="bannerBackup">Back up</button></div>`;
  }
  box.innerHTML = html;
  const b = document.getElementById('bannerBackup');
  if (b) b.onclick = doBackup;
}

/* ============ view toggle ============ */
document.querySelectorAll('#viewToggle button').forEach(b => b.onclick = () => {
  const next = b.dataset.view;
  if (next === viewMode) return;
  if (next === 'year') currentYear = currentMonth.split('-')[0];
  else if (currentMonth.split('-')[0] !== currentYear){
    const now = new Date();
    currentMonth = String(now.getFullYear()) === currentYear ? monthKey(now) : `${currentYear}-01`;
  }
  viewMode = next;
  activeDate = null; document.getElementById('dateInput').value = ''; openCat = null;
  document.querySelectorAll('#viewToggle button').forEach(x => x.setAttribute('aria-pressed', x === b));
  render();
});

/* ============ period menu ============ */
const menu = document.getElementById('periodMenu');
const periodBtn = document.getElementById('periodBtn');

periodBtn.onclick = (ev) => {
  ev.stopPropagation();
  const open = menu.classList.toggle('open');
  periodBtn.setAttribute('aria-expanded', open);
  if (!open) return;

  const totals = {};
  db.expenses.forEach(e => {
    const d = new Date(e.ts);
    const k = viewMode === 'month' ? monthKey(d) : String(d.getFullYear());
    totals[k] = (totals[k] || 0) + e.amount;
  });
  const keys = new Set(Object.keys(totals));
  const now = new Date();
  keys.add(viewMode === 'month' ? monthKey(now) : String(now.getFullYear()));
  keys.add(viewMode === 'month' ? currentMonth : currentYear);

  const active = viewMode === 'month' ? currentMonth : currentYear;
  menu.innerHTML = [...keys].sort().reverse().map(k => `
    <button data-p="${k}" aria-current="${k === active}">
      ${viewMode === 'month' ? labelFor(k) : k}<span class="num">${totals[k] ? '₹' + money(totals[k]) : '—'}</span>
    </button>`).join('');

/* ---- tiny calculator: + - * / and brackets, normal BODMAS ---- */
function evalExpr(raw){
  let s = String(raw).replace(/^\s*=/,'').replace(/[×xX]/g,'*').replace(/÷/g,'/')
                     .replace(/[−–]/g,'-').replace(/,/g,'').trim();
  if (!s) return null;
  if (!/^[0-9+\-*/(). ]+$/.test(s)) return null;
  const tk = s.match(/\d+\.?\d*|[+\-*/()]/g);
  if (!tk) return null;
  let i = 0;
  const peek = () => tk[i];
  function expr(){
    let v = term();
    while (peek() === '+' || peek() === '-'){
      const op = tk[i++], r = term();
      if (v === null || r === null) return null;
      v = op === '+' ? v + r : v - r;
    }
    return v;
  }
  function term(){
    let v = factor();
    while (peek() === '*' || peek() === '/'){
      const op = tk[i++], r = factor();
      if (v === null || r === null || (op === '/' && r === 0)) return null;
      v = op === '*' ? v * r : v / r;
    }
    return v;
  }
  function factor(){
    if (peek() === '-'){ i++; const v = factor(); return v === null ? null : -v; }
    if (peek() === '+'){ i++; return factor(); }
    if (peek() === '('){ i++; const v = expr(); if (tk[i] !== ')') return null; i++; return v; }
    const t = tk[i];
    if (t === undefined || !/^\d/.test(t)) return null;
    i++; return parseFloat(t);
  }
  const val = expr();
  if (val === null || i !== tk.length || !isFinite(val)) return null;
  return Math.round(val * 100) / 100;
}

const isExpression = (v) => /^\s*=/.test(v) || /[+\-*/()×÷]/.test(String(v).slice(1));

function updateCalc(){
  const out = document.getElementById('calcOut');
  const v = amtIn.value;
  if (!isExpression(v)){ out.textContent = ''; out.className = 'calcout'; return; }
  const r = evalExpr(v);
  if (r === null){ out.textContent = 'Incomplete expression'; out.className = 'calcout bad'; }
  else { out.textContent = '= ₹' + money(r); out.className = 'calcout ok'; }
}
amtIn.addEventListener('input', updateCalc);

document.querySelectorAll('.calckey').forEach(k => k.onclick = () => {
  const el = amtIn;
  const a = el.selectionStart ?? el.value.length;
  const b = el.selectionEnd ?? a;
  if (k.dataset.k === 'back'){
    if (a === b && a > 0) el.value = el.value.slice(0, a-1) + el.value.slice(a);
    else el.value = el.value.slice(0, a) + el.value.slice(b);
    var pos = a === b ? Math.max(0, a-1) : a;
  } else {
    el.value = el.value.slice(0, a) + k.dataset.k + el.value.slice(b);
    var pos = a + 1;
  }
  el.focus();
  try { el.setSelectionRange(pos, pos); } catch(e){}
  updateCalc();
});

const fail = (msg) => { errEl.textContent = msg; };

saveBtn.addEventListener('click', () => {
  if (saving) return;

  const amount = evalExpr(amtIn.value);
  if (amount === null) return fail('That expression is incomplete — check the brackets and operators.');
  if (amount <= 0) return fail('Enter an amount greater than zero.');
  if (!pickedCat) return fail('Pick a category.');

  let category = pickedCat, newCategoryToAdd = null;
  if (pickedCat === '__other'){
    category = newCat.value.trim().replace(/\s+/g,' ');
    if (!category) return fail('Name the new category.');
    const existing = allCats().find(c => c.toLowerCase() === category.toLowerCase());
    if (existing) category = existing; else newCategoryToAdd = category;
  }
  if (!pickedMode) return fail('Choose how you paid.');

  const whenVal = document.getElementById('when').value;
  const ts = whenVal ? new Date(whenVal).getTime() : Date.now();
  const note = document.getElementById('note').value.trim();

  const dupe = !editingId && db.expenses.find(e =>
    e.amount === amount && e.category === category && e.mode === pickedMode &&
    (e.note || '') === note && Math.abs(e.ts - ts) < 2000);
  if (dupe){ closeSheets(); toast('Already saved'); return; }

  saving = true;
  saveBtn.disabled = true;
  if (newCategoryToAdd) db.customCats.push(newCategoryToAdd);

  if (editingId){
    const e = db.expenses.find(x => x.id === editingId);
    if (e) Object.assign(e, { amount, category, mode: pickedMode, ts, note });
  } else {
    db.expenses.push({ id: `${ts}-${Math.random().toString(36).slice(2,8)}`, amount, category, mode: pickedMode, ts, note });
  }
  save();

  const d = new Date(ts);
  if (viewMode === 'month') currentMonth = monthKey(d); else currentYear = String(d.getFullYear());
  const wasEdit = !!editingId;
  editingId = null;
  closeSheets();
  render();
  toast(wasEdit ? 'Changes saved' : `₹${money(amount)} recorded`);
});

/* ============ backup and restore ============ */
async function doBackup(){
  const name = `kharcha-paani-${new Date().toISOString().slice(0,10)}.json`;
  const json = JSON.stringify({ ...db, lastBackup: Date.now() }, null, 2);
  const blob = new Blob([json], { type:'application/json' });
  let done = false;
  try {
    const file = new File([blob], name, { type:'application/json' });
    if (navigator.canShare && navigator.canShare({ files:[file] })){
      await navigator.share({ files:[file], title:'Kharcha Paani backup' });
      done = true;
    }
  } catch(e){ if (e && e.name === 'AbortError') return; }
  if (!done){
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = name;
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1500);
  }
  db.lastBackup = Date.now();
  save(); renderBanners(); toast('Backup saved');
}
document.getElementById('exportBtn').onclick = doBackup;
document.getElementById('importBtn').onclick = () => document.getElementById('importFile').click();
document.getElementById('importFile').onchange = (ev) => {
  const f = ev.target.files[0];
  if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    const incoming = loadFrom(r.result);
    if (!incoming){ toast('That file is not a backup'); return; }
    const before = db.expenses.length;
    mergeInto(db, incoming);
    save(); render();
    toast(`${db.expenses.length - before} entries restored`);
  };
  r.readAsText(f);
  ev.target.value = '';
};

/* ============ install plumbing ============ */
(function(){
  function icon(size){
    const c = document.createElement('canvas');
    c.width = c.height = size;
    const x = c.getContext('2d');
    x.fillStyle = '#1B1E2B'; x.fillRect(0,0,size,size);
    x.fillStyle = '#FFA62B';
    x.font = `${Math.round(size*0.56)}px Georgia, serif`;
    x.textAlign = 'center'; x.textBaseline = 'middle';
    x.fillText('₹', size/2, size*0.54);
    return c.toDataURL('image/png');
  }
  try {
    const manifest = {
      name:'Kharcha Paani', short_name:'Kharcha Paani', start_url:'.', display:'standalone',
      background_color:'#FBF9F4', theme_color:'#FBF9F4',
      icons:[{ src: icon(192), sizes:'192x192', type:'image/png' },
             { src: icon(512), sizes:'512x512', type:'image/png' }]
    };
    const link = document.createElement('link');
    link.rel = 'manifest';
    link.href = URL.createObjectURL(new Blob([JSON.stringify(manifest)], { type:'application/manifest+json' }));
    document.head.appendChild(link);
    const apple = document.createElement('link');
    apple.rel = 'apple-touch-icon'; apple.href = icon(180);
    document.head.appendChild(apple);
  } catch(e){}
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch(e){}
})();

render();

(async () => {
  const mirror = loadFrom(await idb.get(KEY));
  const recovered = mergeInto(db, mirror);
  save();
  if (recovered){ render(); toast('Recovered entries from backup copy'); }
})();
